name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Publish docs/wiki to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Wiki source
        shell: bash
        run: |
          set -euo pipefail

          test -d docs/wiki || {
            echo "::error::docs/wiki does not exist."
            exit 1
          }

          count="$(find docs/wiki -maxdepth 1 -type f -name '*.md' | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No Markdown pages found in docs/wiki."
            exit 1
          fi

          echo "Found $count Wiki Markdown pages."

      - name: Check Wiki repository access
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "::error::Missing WIKI_TOKEN secret."
            echo "Create a GitHub token with push access to the Wiki repository and add it as WIKI_TOKEN."
            exit 1
          fi

          WIKI_REPO="https://github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git -c http.extraheader="Authorization: Bearer ${WIKI_TOKEN}"               ls-remote --exit-code "${WIKI_REPO}" HEAD >/dev/null 2>&1; then
            echo "::error::The GitHub Wiki repository is not accessible."
            echo "Enable/initialize the repository Wiki, then ensure WIKI_TOKEN can push to it."
            exit 1
          fi

      - name: Detect Wiki default branch
        id: wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail

          WIKI_REPO="https://github.com/${GITHUB_REPOSITORY}.wiki.git"

          branch="$(
            git -c http.extraheader="Authorization: Bearer ${WIKI_TOKEN}"               ls-remote --symref "${WIKI_REPO}" HEAD |
              sed -n 's/^ref: refs\/heads\/\([^[:space:]]*\)[[:space:]]HEAD$/\1/p'
          )"

          if [ -z "${branch}" ]; then
            echo "::error::Could not determine the Wiki default branch."
            exit 1
          fi

          echo "Wiki default branch: ${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Clone Wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail

          WIKI_REPO="https://github.com/${GITHUB_REPOSITORY}.wiki.git"

          git -c http.extraheader="Authorization: Bearer ${WIKI_TOKEN}"             clone --depth 1 --branch "${{ steps.wiki.outputs.branch }}"             "${WIKI_REPO}" wiki

          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize Wiki pages
        shell: bash
        run: |
          set -euo pipefail

          # GitHub Wiki pages live at repository root. Remove only Markdown pages
          # so GitHub-generated metadata or non-Markdown assets are preserved.
          find wiki -maxdepth 1 -type f -name '*.md' -delete

          cp docs/wiki/*.md wiki/

          # The repository documentation uses Wiki-Index as its navigation index.
          # GitHub Wiki expects Home.md as its landing page.
          if [ -f wiki/Wiki-Index.md ] && [ ! -f wiki/Home.md ]; then
            cp wiki/Wiki-Index.md wiki/Home.md
          fi

      - name: Commit Wiki changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          cd wiki

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "docs: sync HWControl 2.0 Wiki"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Push Wiki
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail

          cd wiki

          # Use an in-memory Authorization header so the token is never written
          # into the Wiki repository's .git/config.
          git -c http.extraheader="Authorization: Bearer ${WIKI_TOKEN}"             push origin "${{ steps.wiki.outputs.branch }}"

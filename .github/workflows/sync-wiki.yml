name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Validate and sync docs/wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Wiki source
        shell: bash
        run: |
          set -euo pipefail
          test -d docs/wiki
          count="$(find docs/wiki -maxdepth 1 -type f -name '*.md' | wc -l)"
          test "$count" -gt 0
          echo "Found $count Wiki Markdown pages."

      - name: Select Wiki credential
        id: auth
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${WIKI_TOKEN:-}" ]; then
            echo "mode=wiki-token" >> "$GITHUB_OUTPUT"
            echo "::notice::Using WIKI_TOKEN for cross-repository Wiki publication."
          else
            echo "mode=github-token" >> "$GITHUB_OUTPUT"
            echo "::notice::WIKI_TOKEN is not configured; the workflow will validate docs/wiki and probe the Wiki with the built-in token."
          fi

      - name: Probe Wiki with configured credential
        id: wiki
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WIKI_REPO="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          TOKEN="${WIKI_TOKEN:-${GH_TOKEN}}"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w 0)"

          if ! output="$(git -c http.extraHeader="$auth_header" ls-remote --symref "$WIKI_REPO" HEAD 2>/dev/null)"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Wiki repository is not reachable with the available credential. docs/wiki validation succeeded; publication was skipped."
            exit 0
          fi

          branch="$(printf '%s\n' "$output" | sed -n 's/^ref: refs\/heads\/\([^[:space:]]*\)[[:space:]]HEAD$/\1/p')"
          if [ -z "$branch" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Wiki repository exists but is not initialized. Publication was skipped."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Clone Wiki
        if: steps.wiki.outputs.available == 'true'
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WIKI_REPO="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          TOKEN="${WIKI_TOKEN:-${GH_TOKEN}}"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w 0)"
          git -c http.extraHeader="$auth_header" clone --depth 1 --branch "${{ steps.wiki.outputs.branch }}" "$WIKI_REPO" wiki
          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize Wiki pages
        if: steps.wiki.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md wiki/
          if [ -f wiki/Wiki-Index.md ]; then cp wiki/Wiki-Index.md wiki/Home.md; fi

      - name: Commit Wiki changes
        id: commit
        if: steps.wiki.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs: sync HWControl 2.0 Wiki"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push Wiki
        if: steps.wiki.outputs.available == 'true' && steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKEN="${WIKI_TOKEN:-${GH_TOKEN}}"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w 0)"
          cd wiki
          git -c http.extraHeader="$auth_header" push origin "${{ steps.wiki.outputs.branch }}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Wiki synchronization"
            echo
            if [ "${{ steps.wiki.outputs.available }}" = "true" ]; then
              echo "Wiki publication path was reachable and synchronization was attempted."
            else
              echo "Wiki source validation succeeded, but publication was skipped because no usable cross-repository credential was available."
              echo
              echo "Set the WIKI_TOKEN repository secret to enable automatic publication to the special .wiki.git repository."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

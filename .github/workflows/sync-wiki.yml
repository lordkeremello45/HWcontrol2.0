name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Validate and sync docs/wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Wiki source
        shell: bash
        run: |
          set -euo pipefail
          test -d docs/wiki
          count="$(find docs/wiki -maxdepth 1 -type f -name '*.md' | wc -l)"
          test "$count" -gt 0
          echo "Found $count Wiki Markdown pages."

      - name: Check Wiki publication credential
        id: auth
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WIKI_TOKEN is not configured. docs/wiki validation passed; Wiki publication was skipped."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::WIKI_TOKEN is configured; using it for .wiki.git publication."
          fi

      - name: Probe Wiki with WIKI_TOKEN
        id: wiki
        if: steps.auth.outputs.enabled == 'true'
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          WIKI_REPO="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w 0)"

          if ! output="$(git -c http.extraHeader="$auth_header" ls-remote --symref "$WIKI_REPO" HEAD 2>/dev/null)"; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WIKI_TOKEN cannot access the Wiki repository. Check that the token can write to the repository Wiki."
            exit 0
          fi

          branch="$(printf '%s\n' "$output" | sed -n 's/^ref: refs\/heads\/\([^[:space:]]*\)[[:space:]]HEAD$/\1/p')"
          if [ -z "$branch" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Wiki repository is reachable but not initialized. Open the Wiki and create/initialize its first page."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Clone Wiki
        if: steps.wiki.outputs.available == 'true'
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          WIKI_REPO="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w 0)"
          git -c http.extraHeader="$auth_header" clone --depth 1 --branch "${{ steps.wiki.outputs.branch }}" "$WIKI_REPO" wiki
          git -C wiki config user.name "github-actions[bot]"
          git -C wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Synchronize Wiki pages
        if: steps.wiki.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find wiki -maxdepth 1 -type f -name '*.md' -delete
          cp docs/wiki/*.md wiki/
          if [ -f wiki/Wiki-Index.md ]; then cp wiki/Wiki-Index.md wiki/Home.md; fi

      - name: Commit Wiki changes
        id: commit
        if: steps.wiki.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs: sync HWControl 2.0 Wiki"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push Wiki
        if: steps.wiki.outputs.available == 'true' && steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          set -euo pipefail
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w 0)"
          cd wiki
          git -c http.extraHeader="$auth_header" push origin "${{ steps.wiki.outputs.branch }}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Wiki synchronization"
            echo
            if [ "${{ steps.wiki.outputs.available }}" = "true" ]; then
              echo "Wiki publication completed or was attempted using WIKI_TOKEN."
            elif [ "${{ steps.auth.outputs.enabled }}" != "true" ]; then
              echo "Wiki source validation succeeded. Publication was skipped because WIKI_TOKEN is not configured."
              echo
              echo "Add the WIKI_TOKEN repository secret to enable automatic publication to .wiki.git."
            else
              echo "Wiki source validation succeeded, but the configured WIKI_TOKEN could not access the Wiki repository."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Temporary Go format repair

# One-time maintainer repair for pre-existing gofmt drift. Remove after this run.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-gofmt-repair.yml"

permissions:
  contents: write

concurrency:
  group: temporary-gofmt-repair-main
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main with write access for the one-time format commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: true
          ref: main
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Apply standard Go formatting and commit only Go source formatting
        shell: bash
        run: |
          set -euo pipefail
          find bridge_service -type f -name '*.go' -print0 | xargs -0 -r gofmt -w
          unformatted="$(gofmt -l bridge_service)"
          if [ -n "$unformatted" ]; then
            printf 'Files still not formatted:\n%s\n' "$unformatted" >&2
            exit 1
          fi
          git diff --check
          changed="$(git diff --name-only -- bridge_service)"
          if [ -z "$changed" ]; then
            echo "Go source already formatted; no commit required."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Ev '^bridge_service/.*\.go$'; then
            echo "Unexpected non-Go file changed; refusing to commit." >&2
            exit 1
          fi
          printf '%s\n' "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bridge_service
          git commit -m "style: format Go bridge and security services"
          git push origin HEAD:main
      - name: Run Go static analysis and race tests
        working-directory: bridge_service
        run: |
          go vet ./...
          go test -race -count=1 ./...

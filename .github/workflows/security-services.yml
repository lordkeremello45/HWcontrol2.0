name: Security services

on:
  push:
    branches: [main]
    paths:
      - 'bridge_service/src/**'
      - 'bridge_service/security_guardian/**'
      - '.github/workflows/security-services.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'bridge_service/src/**'
      - 'bridge_service/security_guardian/**'
      - '.github/workflows/security-services.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge_service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Go formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(git diff --name-only --diff-filter=ACMR "$PR_BASE_SHA" "$CURRENT_SHA" -- bridge_service/src bridge_service/security_guardian | sed 's#^bridge_service/##' | grep -E '[.]go"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            files="$(git diff --name-only --diff-filter=ACMR "$PUSH_BEFORE_SHA" "$CURRENT_SHA" -- bridge_service/src bridge_service/security_guardian | sed 's#^bridge_service/##' | grep -E '\\.go$' || true)"
          else
            files="$(find src security_guardian -type f -name '*.go' -print)"
          fi

          if [[ -z "$files" ]]; then
            echo "No changed Go files to format-check."
            exit 0
          fi

          unformatted="$(printf '%s\n' "$files" | xargs -r gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test bridge services
        run: go test -race -count=1 ./src
      - name: Build security guardian
        run: go build -trimpath -o security-guardian ./security_guardian
      - name: Smoke-test guardian build
        run: ./security-guardian --help >/dev/null 2>&1 || test $? -eq 1

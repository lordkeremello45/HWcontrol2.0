name: Security audit

on:
  pull_request:
    paths:
      - 'bridge_service/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'bridge_service/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-security:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Security tooling now requires Go 1.25+/1.26 while the application
          # build remains pinned independently in the platform workflows.
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: bridge_service/go.sum
      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Vulnerability scan
        run: govulncheck ./...
      - name: Static security scan
        run: |
          # Known legacy findings are tracked by the bridge hardening work in
          # PR #12. Keep gosec active while excluding only that explicit
          # baseline; newly introduced rule IDs remain blocking.
          gosec -exclude=G702,G703,G204,G304,G306 ./...
      - name: Tests
        run: go test ./...

  shell-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shell lint
        run: |
          mapfile -t files < <(find deploy scripts -type f \( -name '*.sh' -o -name '*.bash' \) -print)
          if ((${#files[@]})); then
            shellcheck "${files[@]}"
          fi

  workflow-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow permissions
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          failures = []
          for path in pathlib.Path('.github/workflows').glob('*.y*ml'):
              text = path.read_text(encoding='utf-8')
              if re.search(r'(^|\n)\s*permissions:\s*write-all\s*(\n|$)', text):
                  failures.append(f'{path}: write-all permissions are forbidden')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('No write-all workflow permission blocks found.')
          PY

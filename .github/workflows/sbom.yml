name: Generate SBOM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional stable platform release tag to build and attach this SBOM to'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: hwcontrol-sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hwcontrol-sbom
          path: hwcontrol-sbom.spdx.json

      - name: Attest release SBOM
        if: inputs.tag != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: hwcontrol-sbom.spdx.json

      - name: Attach SBOM to stable platform release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(windows|linux|macos)$ ]] || {
            echo "SBOM release tag must be a stable platform tag." >&2
            exit 1
          }
          test -s hwcontrol-sbom.spdx.json
          gh release upload "$TAG" hwcontrol-sbom.spdx.json --repo "$GITHUB_REPOSITORY" --clobber

name: Windows MSIX validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gui_dashboard/**'
      - '.github/workflows/msix-validation.yml'
      - 'bridge_service/**'
      - 'ai_core/**'

permissions:
  contents: read

concurrency:
  group: msix-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_PROJECT: gui_dashboard
  FLUTTER_VERSION: 3.47.2

jobs:
  validate:
    name: Build, install, smoke-test and uninstall MSIX
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.2
        with:
          version: latest

      - name: Verify WinApp CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winapp --help | Select-Object -First 5

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows desktop project
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'windows/CMakeLists.txt')) {
            flutter create --platforms=windows --project-name hwcontrol_dashboard .
          }
          if (-not (Test-Path -LiteralPath 'windows/CMakeLists.txt')) {
            throw 'Flutter Windows desktop project was not generated.'
          }

      - name: Install dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter pub get

      - name: Run dashboard tests
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter test

      - name: Build Flutter Windows release
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter build windows --release -t lib/installer_main.dart

      - name: Build unsigned CI MSIX
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dart run msix:create `
            --build-windows false `
            --display-name 'HWControl' `
            --publisher-display-name 'HWControl CI' `
            --identity-name 'HWControl.CI' `
            --publisher 'CN=HWControl CI' `
            --version 0.2.4.0 `
            --architecture x64 `
            --languages en-us `
            --install-certificate false `
            --sign-msix false `
            --output-path build/msix `
            --output-name HWControl-CI
          if ($LASTEXITCODE -ne 0) { throw "MSIX creation failed with exit code $LASTEXITCODE" }

      - name: Locate MSIX
        id: package
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          $msix = Get-ChildItem build/msix -Filter '*.msix' -File -Recurse | Select-Object -First 1
          if (-not $msix) { throw 'MSIX package was not produced.' }
          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX: $($msix.FullName)"

      - name: Extract MSIX manifest for certificate generation
        id: manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = '${{ steps.package.outputs.path }}'
          $zip = Join-Path $env:RUNNER_TEMP 'hwcontrol-msix.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'hwcontrol-msix-manifest'
          Copy-Item -LiteralPath $msix -Destination $zip -Force
          Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $manifest = Join-Path $dir 'AppxManifest.xml'
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'MSIX AppxManifest.xml was not found.' }
          "path=$manifest" >> $env:GITHUB_OUTPUT
          Write-Host "Manifest: $manifest"

      - name: Create isolated CI signing certificate
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'hwcontrol-winapp-cert'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $pfxPath = Join-Path $outDir 'hwcontrol-ci.pfx'
          $cerPath = Join-Path $outDir 'hwcontrol-ci.cer'
          $password = 'password'

          Write-Host 'Generating CI development certificate with WinApp CLI...'
          winapp cert generate `
            --manifest '${{ steps.manifest.outputs.path }}' `
            --output $pfxPath `
            --password $password `
            --valid-days 1 `
            --if-exists Overwrite `
            --export-cer
          if ($LASTEXITCODE -ne 0) { throw "WinApp CLI certificate generation failed with exit code $LASTEXITCODE" }

          if (-not (Test-Path -LiteralPath $pfxPath)) { throw 'WinApp CLI did not produce a PFX certificate.' }
          if (-not (Test-Path -LiteralPath $cerPath)) { throw 'WinApp CLI did not produce a CER certificate.' }

          Write-Host 'CI certificate generated successfully.'
          "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
          "cer_path=$cerPath" >> $env:GITHUB_OUTPUT
          "pfx_password=$password" >> $env:GITHUB_OUTPUT

      - name: Inspect generated certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winapp cert info '${{ steps.cert.outputs.pfx_path }}' --password '${{ steps.cert.outputs.pfx_password }}'
          if ($LASTEXITCODE -ne 0) { throw 'WinApp CLI certificate inspection failed.' }

      - name: Trust CI certificate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          winapp cert install '${{ steps.cert.outputs.pfx_path }}'
          if ($LASTEXITCODE -ne 0) { throw 'WinApp CLI certificate installation failed.' }

      - name: Sign MSIX for isolated CI installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          winapp sign '${{ steps.package.outputs.path }}' '${{ steps.cert.outputs.pfx_path }}' --password '${{ steps.cert.outputs.pfx_password }}'
          if ($LASTEXITCODE -ne 0) { throw 'WinApp CLI MSIX signing failed.' }

      - name: Verify MSIX signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = '${{ steps.package.outputs.path }}'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction Stop | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner.' }
          & $signtool.FullName verify /pa /all $msix
          if ($LASTEXITCODE -ne 0) { throw 'MSIX package signature verification failed.' }

      - name: Inspect MSIX manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = '${{ steps.package.outputs.path }}'
          $zip = Join-Path $env:RUNNER_TEMP 'package.zip'
          $temp = Join-Path $env:RUNNER_TEMP 'msix-expand'
          Copy-Item $msix $zip -Force
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $temp -Force
          [xml]$xml = Get-Content (Join-Path $temp 'AppxManifest.xml')
          $identity = $xml.Package.Identity
          if ($identity.Name -ne 'HWControl.CI') { throw "Unexpected package identity: $($identity.Name)" }
          if ($identity.ProcessorArchitecture -ne 'x64') { throw "Unexpected package architecture: $($identity.ProcessorArchitecture)" }
          if ($identity.Publisher -ne 'CN=HWControl CI') { throw "Unexpected package publisher: $($identity.Publisher)" }
          Write-Host "Identity: $($identity.Name)"
          Write-Host "Architecture: $($identity.ProcessorArchitecture)"
          Write-Host "Publisher: $($identity.Publisher)"

      - name: Install MSIX
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Appx -ErrorAction Stop
          $msix = '${{ steps.package.outputs.path }}'
          Add-AppxPackage -Path $msix -ForceApplicationShutdown -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction Stop
          if (-not $pkg) { throw 'MSIX package is not registered after installation.' }
          Write-Host "Installed package: $($pkg.Name) $($pkg.Version)"

      - name: Validate installed app payload
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Appx -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction Stop
          if (-not $pkg) { throw 'Installed package could not be located.' }
          $exe = Join-Path $pkg.InstallLocation 'hwcontrol_dashboard.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Flutter dashboard executable is missing: $exe" }
          Write-Host "Installed executable: $exe"

      - name: Launch installed application smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Appx -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction Stop
          if (-not $pkg) { throw 'Installed package could not be located.' }

          $msix = '${{ steps.package.outputs.path }}'
          $zip = Join-Path $env:RUNNER_TEMP 'launch-manifest.zip'
          $temp = Join-Path $env:RUNNER_TEMP 'launch-manifest'
          Copy-Item -LiteralPath $msix -Destination $zip -Force
          Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $temp -Force

          [xml]$xml = Get-Content -LiteralPath (Join-Path $temp 'AppxManifest.xml')
          $application = $xml.Package.Applications.Application | Select-Object -First 1
          if (-not $application) { throw 'MSIX application entry was not found in AppxManifest.xml.' }

          $appId = [string]$application.Id
          if ([string]::IsNullOrWhiteSpace($appId)) { throw 'MSIX Application Id is missing.' }

          $activationTarget = "shell:AppsFolder\$($pkg.PackageFamilyName)!$appId"
          Write-Host "Launching packaged app through shell activation: $activationTarget"
          $shell = Start-Process -FilePath 'explorer.exe' -ArgumentList @($activationTarget) -PassThru

          Start-Sleep -Seconds 5

          $exePath = Join-Path $pkg.InstallLocation 'hwcontrol_dashboard.exe'
          $running = Get-Process -ErrorAction SilentlyContinue | Where-Object {
            try { $_.Path -eq $exePath } catch { $false }
          }

          if (-not $running) {
            throw "Packaged application was not running after shell activation: $exePath"
          }

          Write-Host "Packaged application smoke test passed: PID $($running[0].Id)"
          $running | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          if ($shell -and -not $shell.HasExited) {
            Stop-Process -Id $shell.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Uninstall MSIX
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Appx -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction SilentlyContinue
          if ($pkg) {
            Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction Stop
          }
          $remaining = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction SilentlyContinue
          if ($remaining) { throw 'MSIX package remains registered after uninstall.' }
          Write-Host 'MSIX uninstall verification passed.'

      - name: Upload tested MSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-v0.2.4-windows-MSIX-tested
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

name: Windows MSIX validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gui_dashboard/**'
      - '.github/workflows/msix-validation.yml'
      - 'bridge_service/**'
      - 'ai_core/**'

permissions:
  contents: read

concurrency:
  group: msix-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_PROJECT: gui_dashboard
  FLUTTER_VERSION: 3.47.2

jobs:
  validate:
    name: Build, install, smoke-test and uninstall MSIX
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows desktop project
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'windows/CMakeLists.txt')) {
            flutter create --platforms=windows --project-name hwcontrol_dashboard .
          }
          if (-not (Test-Path -LiteralPath 'windows/CMakeLists.txt')) {
            throw 'Flutter Windows desktop project was not generated.'
          }

      - name: Install dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter pub get

      - name: Run dashboard tests
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter test

      - name: Build Flutter Windows release
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter build windows --release -t lib/installer_main.dart

      - name: Configure CI MSIX metadata
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          @'

          msix_config:
            display_name: HWControl
            publisher_display_name: HWControl CI
            identity_name: HWControl.CI
            publisher: CN=HWControl CI
            msix_version: 0.2.4.0
            architecture: x64
            install_certificate: false
            languages: en-us
          '@ | Add-Content pubspec.yaml

      - name: Build MSIX
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: dart run msix:create --version 0.2.4.0 --output-path build/msix

      - name: Locate MSIX
        id: package
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          $msix = Get-ChildItem build/msix -Filter '*.msix' -File -Recurse | Select-Object -First 1
          if (-not $msix) { throw 'MSIX package was not produced.' }
          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX: $($msix.FullName)"

      - name: Create isolated CI signing certificate
        id: cert
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'hwcontrol-msix-cert'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $pfxPath = Join-Path $outDir 'hwcontrol-ci.pfx'
          $cerPath = Join-Path $outDir 'hwcontrol-ci.cer'
          $password = [Guid]::NewGuid().ToString('N')

          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $dn = [System.Security.Cryptography.X509Certificates.X500DistinguishedName]::new('CN=HWControl CI')
          $req = [System.Security.Cryptography.X509Certificates.CertificateRequest]::new(
            $dn,
            $rsa,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.RSASignaturePadding]::Pkcs1
          )

          $keyUsage = [System.Security.Cryptography.X509Certificates.X509KeyUsageExtension]::new(
            [System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature,
            $true
          )
          $req.CertificateExtensions.Add($keyUsage)

          $ekuOids = [System.Security.Cryptography.OidCollection]::new()
          $ekuOids.Add([System.Security.Cryptography.Oid]::new('1.3.6.1.5.5.7.3.3')) | Out-Null
          $req.CertificateExtensions.Add(
            [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]::new($ekuOids, $false)
          )

          $cert = $req.CreateSelfSigned((Get-Date).AddMinutes(-5), (Get-Date).AddDays(1))
          [System.IO.File]::WriteAllBytes($pfxPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $password))
          [System.IO.File]::WriteAllBytes($cerPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))

          foreach ($storeName in @('Root','TrustedPeople')) {
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new($storeName, 'CurrentUser')
            $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
            try { $store.Add($cert) } finally { $store.Close() }
          }

          "pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
          "cer_path=$cerPath" >> $env:GITHUB_OUTPUT
          "pfx_password=$password" >> $env:GITHUB_OUTPUT
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          Write-Host "Created CI certificate $($cert.Thumbprint)"

      - name: Sign MSIX for isolated CI installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = '${{ steps.package.outputs.path }}'
          $pfx = '${{ steps.cert.outputs.pfx_path }}'
          $password = '${{ steps.cert.outputs.pfx_password }}'
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction Stop | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner.' }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $password /td SHA256 $msix
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
          & $signtool.FullName verify /pa /all $msix
          if ($LASTEXITCODE -ne 0) { throw 'MSIX package signature verification failed.' }

      - name: Inspect MSIX manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = '${{ steps.package.outputs.path }}'
          $zip = Join-Path $env:RUNNER_TEMP 'package.zip'
          $temp = Join-Path $env:RUNNER_TEMP 'msix-expand'
          Copy-Item $msix $zip -Force
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $temp -Force
          [xml]$xml = Get-Content (Join-Path $temp 'AppxManifest.xml')
          $identity = $xml.Package.Identity
          if ($identity.Name -ne 'HWControl.CI') { throw "Unexpected package identity: $($identity.Name)" }
          if ($identity.ProcessorArchitecture -ne 'x64') { throw "Unexpected package architecture: $($identity.ProcessorArchitecture)" }
          if ($identity.Publisher -ne 'CN=HWControl CI') { throw "Unexpected package publisher: $($identity.Publisher)" }
          Write-Host "Identity: $($identity.Name)"
          Write-Host "Architecture: $($identity.ProcessorArchitecture)"
          Write-Host "Publisher: $($identity.Publisher)"

      - name: Install MSIX
        shell: powershell
        run: |
          Import-Module Appx -ErrorAction Stop
          $msix = '${{ steps.package.outputs.path }}'
          Add-AppxPackage -Path $msix -ForceApplicationShutdown -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction Stop
          if (-not $pkg) { throw 'MSIX package is not registered after installation.' }
          Write-Host "Installed package: $($pkg.Name) $($pkg.Version)"

      - name: Validate installed app payload
        shell: powershell
        run: |
          Import-Module Appx -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction Stop
          if (-not $pkg) { throw 'Installed package could not be located.' }
          $exe = Join-Path $pkg.InstallLocation 'hwcontrol_dashboard.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "Flutter dashboard executable is missing: $exe" }
          Write-Host "Installed executable: $exe"

      - name: Launch installed application smoke test
        shell: powershell
        run: |
          Import-Module Appx -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction Stop
          $exe = Join-Path $pkg.InstallLocation 'hwcontrol_dashboard.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited -and $process.ExitCode -ne 0) {
            throw "Installed application exited unexpectedly with code $($process.ExitCode)."
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Uninstall MSIX
        if: always()
        shell: powershell
        run: |
          Import-Module Appx -ErrorAction Stop
          $pkg = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction SilentlyContinue
          if ($pkg) {
            Remove-AppxPackage -Package $pkg.PackageFullName -ErrorAction Stop
          }
          $remaining = Get-AppxPackage -Name 'HWControl.CI' -ErrorAction SilentlyContinue
          if ($remaining) { throw 'MSIX package remains registered after uninstall.' }
          Write-Host 'MSIX uninstall verification passed.'

      - name: Upload tested MSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-v0.2.4-windows-MSIX-tested
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

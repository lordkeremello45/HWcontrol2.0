name: Release integrity

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (for example v0.2.0-windows)'
        required: true
        type: string
      require_linux_extras:
        description: 'Require RPM and Arch assets for a Linux release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-and-publish:
    name: Verify release assets and publish SHA256/SHA512/SHA3-512 manifests
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="$EVENT_TAG"
          if [ -z "$TAG" ]; then TAG="$INPUT_TAG"; fi
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve Linux extra package policy
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REQUIRE: ${{ inputs.require_linux_extras }}
        run: |
          set -euo pipefail
          require=false
          if [ "$EVENT_NAME" = 'release' ] || [ "$INPUT_REQUIRE" = 'true' ]; then require=true; fi
          echo "require_linux_extras=$require" >> "$GITHUB_OUTPUT"

      - name: Wait for Linux extra packages
        if: endsWith(steps.release.outputs.tag, '-linux') && steps.policy.outputs.require_linux_extras == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Waiting for RPM and Arch assets for $TAG..."
          for attempt in $(seq 1 60); do
            assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$assets" | grep -Fxq "HWControl-${TAG}-Linux-x64.rpm" && \
               printf '%s\n' "$assets" | grep -Fxq "HWControl-${TAG}-Linux-x64.pkg.tar.zst" && \
               printf '%s\n' "$assets" | grep -Fxq "HWControl-${TAG}-Linux-extra.sha256"; then
              echo 'Linux extra packages are present.'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for Linux extra packages.' >&2
          exit 1

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern '*' --clobber

      - name: Verify individual SHA256 files
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          found=0
          for checksum in *.sha256; do
            found=1
            mapfile -t entries < <(awk 'NF >= 2 {print $1 "\t" $2}' "$checksum")
            test "${#entries[@]}" -gt 0 || { echo "Empty checksum manifest: $checksum"; exit 1; }
            for entry in "${entries[@]}"; do
              expected="${entry%%$'\t'*}"
              asset="${entry#*$'\t'}"
              asset="${asset#\*}"
              test -f "$asset" || { echo "Missing asset for $checksum: $asset"; exit 1; }
              actual=$(sha256sum "$asset" | awk '{print $1}')
              test "$expected" = "$actual" || { echo "SHA256 mismatch: $asset"; exit 1; }
              echo "Verified SHA256: $asset"
            done
          done
          if [ "$found" -eq 0 ]; then
            echo 'No individual .sha256 files found.' >&2
            exit 1
          fi

      - name: Verify individual SHA512 files when present
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          for checksum in *.sha512; do
            mapfile -t entries < <(awk 'NF >= 2 {print $1 "\t" $2}' "$checksum")
            test "${#entries[@]}" -gt 0 || { echo "Empty SHA512 manifest: $checksum"; exit 1; }
            for entry in "${entries[@]}"; do
              expected="${entry%%$'\t'*}"
              asset="${entry#*$'\t'}"
              asset="${asset#\*}"
              test -f "$asset" || { echo "Missing asset for $checksum: $asset"; exit 1; }
              actual=$(sha512sum "$asset" | awk '{print $1}')
              test "$expected" = "$actual" || { echo "SHA512 mismatch: $asset"; exit 1; }
              echo "Verified SHA512: $asset"
            done
          done

      - name: Validate expected platform packages
        env:
          TAG: ${{ steps.release.outputs.tag }}
          REQUIRE_LINUX_EXTRAS: ${{ steps.policy.outputs.require_linux_extras }}
        run: |
          set -euo pipefail
          cd release-assets
          case "$TAG" in
            *-windows)
              compgen -G '*.msi' >/dev/null || compgen -G '*.zip' >/dev/null || { echo 'Windows release has no MSI or ZIP asset'; exit 1; }
              ;;
            *-macos)
              compgen -G '*.pkg' >/dev/null || compgen -G '*.dmg' >/dev/null || { echo 'macOS release has no PKG or DMG asset'; exit 1; }
              ;;
            *-linux)
              compgen -G '*.deb' >/dev/null || compgen -G '*.tar.gz' >/dev/null || compgen -G '*.tar.zst' >/dev/null || { echo 'Linux release has no DEB/TAR asset'; exit 1; }
              if [ "$REQUIRE_LINUX_EXTRAS" = 'true' ]; then
                test -f "HWControl-${TAG}-Linux-x64.rpm"
                test -f "HWControl-${TAG}-Linux-x64.pkg.tar.zst"
                test -f "HWControl-${TAG}-Linux-extra.sha256"
              fi
              ;;
            *)
              echo "Generic/unified tag: package-specific validation skipped."
              ;;
          esac

      - name: Generate release-wide SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA512SUMS.txt' ! -name 'SHA3-512SUMS.txt' ! -name '*.sha256' ! -name '*.sha512' ! -name '*.sha3-512' ! -name '*.sig' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release-wide SHA512SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA512SUMS.txt
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA512SUMS.txt' ! -name 'SHA3-512SUMS.txt' ! -name '*.sha256' ! -name '*.sha512' ! -name '*.sha3-512' ! -name '*.sig' -print0 \
            | sort -z \
            | xargs -0 sha512sum > SHA512SUMS.txt
          test -s SHA512SUMS.txt
          cat SHA512SUMS.txt

      - name: Generate release-wide SHA3-512SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA3-512SUMS.txt
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'SHA512SUMS.txt' ! -name 'SHA3-512SUMS.txt' ! -name '*.sha256' ! -name '*.sha512' ! -name '*.sha3-512' ! -name '*.sig' -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                printf '%s  %s\n' "$(openssl dgst -sha3-512 -r "$file" | awk '{print $1}')" "${file#./}"
              done > SHA3-512SUMS.txt
          test -s SHA3-512SUMS.txt
          cat SHA3-512SUMS.txt

      - name: Verify generated SHA3-512SUMS.txt
        run: |
          set -euo pipefail
          cd release-assets
          while IFS= read -r line; do
            expected="${line%%  *}"
            asset="${line#*  }"
            test -f "$asset" || { echo "Missing asset for SHA3-512SUMS.txt: $asset"; exit 1; }
            actual=$(openssl dgst -sha3-512 -r "$asset" | awk '{print $1}')
            test "$expected" = "$actual" || { echo "SHA3-512 mismatch: $asset"; exit 1; }
          done < SHA3-512SUMS.txt

      - name: Sign SHA256SUMS.txt with Ed25519
        id: ed25519
        if: ${{ secrets.ED25519_PRIVATE_KEY_B64 != '' }}
        env:
          ED25519_PRIVATE_KEY_B64: ${{ secrets.ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/hwcontrol-release-ed25519.pem"
          printf '%s' "$ED25519_PRIVATE_KEY_B64" | base64 --decode > "$key"
          chmod 600 "$key"
          openssl pkeyutl -sign -rawin -inkey "$key" \
            -in release-assets/SHA256SUMS.txt \
            -out release-assets/SHA256SUMS.txt.sig
          test -s release-assets/SHA256SUMS.txt.sig
          rm -f "$key"
          echo 'Ed25519 signature generated.'
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Verify Ed25519 signature before publishing
        if: steps.ed25519.outputs.signed == 'true'
        env:
          ED25519_PUBLIC_KEY_PEM: ${{ secrets.ED25519_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$ED25519_PUBLIC_KEY_PEM" || { echo 'ED25519_PUBLIC_KEY_PEM must be configured when Ed25519 signing is enabled.'; exit 1; }
          public="$RUNNER_TEMP/hwcontrol-release-ed25519.pub"
          printf '%s\n' "$ED25519_PUBLIC_KEY_PEM" > "$public"
          openssl pkeyutl -verify -rawin -pubin -inkey "$public" \
            -in release-assets/SHA256SUMS.txt \
            -sigfile release-assets/SHA256SUMS.txt.sig
          rm -f "$public"
          echo 'Ed25519 signature verified.'

      - name: Publish Ed25519 status when signing is not configured
        if: steps.ed25519.outputs.signed != 'true'
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Ed25519 manifest signing is not configured for this release.' \
            'Configure ED25519_PRIVATE_KEY_B64 and ED25519_PUBLIC_KEY_PEM repository secrets to enable it.' \
            > release-assets/ED25519-SIGNING-STATUS.txt

      - name: Upload SHA256SUMS.txt to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Ed25519 signature to release
        if: steps.ed25519.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/SHA256SUMS.txt.sig --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload Ed25519 status to release
        if: steps.ed25519.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/ED25519-SIGNING-STATUS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload SHA512SUMS.txt to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/SHA512SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload SHA3-512SUMS.txt to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/SHA3-512SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Attest SHA256SUMS.txt provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA256SUMS.txt

      - name: Attest SHA512SUMS.txt provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA512SUMS.txt

      - name: Attest SHA3-512SUMS.txt provenance
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA3-512SUMS.txt

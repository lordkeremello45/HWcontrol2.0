name: Publish Linux release

on:
  push:
    branches:
      - main
    tags:
      - 'v*-linux'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing platform tag, for example vX.Y.Z-linux or vX.Y.Z-beta-linux'
        required: true
        type: string
      source_ref:
        description: 'Source branch or commit to build'
        required: true
        default: main
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FLUTTER_VERSION: 3.47.2
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

jobs:
  build-linux:
    name: Build and package Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REF }}

      - name: Resolve checked-out source commit
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve checked-out source commit" >&2; exit 1; }
          echo "SOURCE_COMMIT_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Verify existing release tag is immutable
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          remote_ref="$(git ls-remote origin "refs/tags/$RELEASE_TAG")"
          [[ -n "$remote_ref" ]] || { echo "Release tag $RELEASE_TAG does not exist; refusing to publish an untagged commit" >&2; exit 1; }
          if [[ -n "$remote_ref" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
            source_sha="$(git rev-parse HEAD)"
            [[ "$tag_sha" == "$source_sha" ]] || { echo "Tag $RELEASE_TAG points at $tag_sha, not source commit $source_sha" >&2; exit 1; }
          fi

      - name: Resolve main-branch package version
        id: resolve-main-tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' gui_dashboard/pubspec.yaml | head -n1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Could not read numeric application version from pubspec.yaml" >&2; exit 1; }
          tag="v${version}-main-${GITHUB_SHA}-linux"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Main-branch package tag: $tag"

      - name: Validate release tag format
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?-linux$ ]] || { echo "Invalid linux release tag: $RELEASE_TAG" >&2; exit 1; }

      - name: Validate app version against package tag
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' gui_dashboard/pubspec.yaml | head -n1)"
          tag_version="${RELEASE_TAG#v}"
          tag_version="${tag_version%%-*}"
          [[ "$app_version" == "$tag_version" ]] || { echo "Package tag version $tag_version does not match app version $app_version" >&2; exit 1; }

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev zstd dpkg-dev zip unzip

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build and test native/bridge/dashboard
        run: |
          set -euo pipefail
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          (cd bridge_service && go vet ./... && go test -count=1 ./... && go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service ./src && go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../security-guardian ./security_guardian)
          (cd gui_dashboard && flutter create --platforms=linux --no-pub . && git restore pubspec.yaml test/widget_test.dart && flutter pub get && flutter analyze && flutter test --no-pub && flutter build linux --release -t lib/installer_main.dart --dart-define=HWCONTROL_RELEASE_TRUST=official)

      - name: Build and validate Linux packages
        run: |
          set -euo pipefail
          bash scripts/package-linux.sh "$RELEASE_TAG" build

      - name: Build and validate portable ZIP
        run: |
          set -euo pipefail
          archive="HWControl-${RELEASE_TAG}-Linux-x64.tar.gz"
          zip_file="HWControl-${RELEASE_TAG}-Linux-x64.zip"
          verify_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir"' EXIT
          tar -xzf "$archive" -C "$verify_dir"
          root="$(find "$verify_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$root"
          test -x "$root/ai_engine"
          test -x "$root/bridge-service"
          test -x "$root/security-guardian"
          test -x "$root/dashboard/hwcontrol_dashboard"
          (cd "$verify_dir" && zip -qr "$GITHUB_WORKSPACE/$zip_file" "$(basename "$root")")
          unzip -t "$zip_file"
          unzip -Z1 "$zip_file" | grep -Fxq "$(basename "$root")/ai_engine"
          unzip -Z1 "$zip_file" | grep -Fxq "$(basename "$root")/bridge-service"

      - name: Install and smoke-test DEB
        run: |
          set -euo pipefail
          sudo apt-get install -y "./HWControl-${RELEASE_TAG}-Linux-x64.deb"
          test "$(dpkg-query -W -f='${Status}' hwcontrol)" = 'install ok installed'
          test -x /usr/bin/hwcontrol
          test -x /opt/hwcontrol/bridge-service
          test -x /opt/hwcontrol/hwcontrol_audio_probe
          test -x /opt/hwcontrol/ai_engine
          test -x /opt/hwcontrol/security-guardian
          test -f /var/lib/hwcontrol/security/canary/bridger.key
          ldd /opt/hwcontrol/ai_engine | tee /tmp/hwcontrol-engine-ldd.txt
          ! grep -Fq 'not found' /tmp/hwcontrol-engine-ldd.txt
          ldd /opt/hwcontrol/dashboard/hwcontrol_dashboard | tee /tmp/hwcontrol-dashboard-ldd.txt
          ! grep -Fq 'not found' /tmp/hwcontrol-dashboard-ldd.txt
          sudo dpkg -r hwcontrol
          test "$(dpkg-query -W -f='${db:Status-Status}' hwcontrol 2>/dev/null || true)" != installed
          test ! -e /opt/hwcontrol
          test ! -e /usr/bin/hwcontrol
          test -f /var/lib/hwcontrol/bridge.key

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum HWControl-${RELEASE_TAG}-Linux-x64.deb HWControl-${RELEASE_TAG}-Linux-x64.tar.gz HWControl-${RELEASE_TAG}-Linux-x64.tar.zst HWControl-${RELEASE_TAG}-Linux-x64.zip > HWControl-${RELEASE_TAG}-Linux-x64.sha256
          sha256sum -c HWControl-${RELEASE_TAG}-Linux-x64.sha256

      - name: Sign Linux checksum manifest with the pinned release GPG key
        env:
          HWCONTROL_GPG_PRIVATE_KEY_B64: ${{ secrets.HWCONTROL_GPG_PRIVATE_KEY_B64 }}
          HWCONTROL_GPG_PASSPHRASE: ${{ secrets.HWCONTROL_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          has_key=false
          has_passphrase=false
          [[ -n "${HWCONTROL_GPG_PRIVATE_KEY_B64:-}" ]] && has_key=true
          [[ -n "${HWCONTROL_GPG_PASSPHRASE:-}" ]] && has_passphrase=true
          if [[ "$has_key" != "$has_passphrase" ]]; then
            echo 'Both Linux release GPG secrets must be configured together.' >&2
            exit 1
          fi
          if [[ "$has_key" != true ]]; then
            echo 'LINUX_GPG_SIGNING_CONFIGURED=false' >> "$GITHUB_ENV"
            echo 'Linux release manifest remains unsigned; final-release readiness will reject it.'
            exit 0
          fi

          export GNUPGHOME="$RUNNER_TEMP/hwcontrol-release-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$HWCONTROL_GPG_PRIVATE_KEY_B64" | base64 --decode | gpg --batch --import
          expected_fingerprint="$(grep -Eo '[A-F0-9]{40}' HWControl-GPG-fingerprint.txt | head -n1)"
          actual_fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          [[ -n "$expected_fingerprint" && "$actual_fingerprint" == "$expected_fingerprint" ]] || {
            echo "Release signing key fingerprint mismatch: expected $expected_fingerprint, received $actual_fingerprint" >&2
            exit 1
          }

          manifest="HWControl-${RELEASE_TAG}-Linux-x64.sha256"
          signature="${manifest}.asc"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --local-user "$expected_fingerprint" --armor --detach-sign --output "$signature" "$manifest" 3<<<"$HWCONTROL_GPG_PASSPHRASE"
          gpg --batch --verify "$signature" "$manifest"
          echo 'LINUX_GPG_SIGNING_CONFIGURED=true' >> "$GITHUB_ENV"

      - name: Attest Linux packages and checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: |
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.deb
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.tar.gz
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.tar.zst
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.zip
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.sha256

      - name: Attest Linux GPG signature when configured
        if: env.LINUX_GPG_SIGNING_CONFIGURED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.sha256.asc

      - name: Upload Linux main-branch packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-main-${{ github.sha }}-Linux-x64
          path: |
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-Linux-x64.deb
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-Linux-x64.tar.gz
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-Linux-x64.tar.zst
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-Linux-x64.zip
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-Linux-x64.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish Linux release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ startsWith(env.RELEASE_TAG, 'v0.3.0-') && 'HWcontrol2.0 Beta — Linux' || format('HWControl {0}', env.RELEASE_TAG) }}
          tag_name: ${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_COMMIT_SHA }}
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta') }}
          files: |
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.deb
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.tar.gz
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.tar.zst
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.zip
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-Linux-x64.sha256
            HWControl-GPG-public.asc
            HWControl-GPG-fingerprint.txt

      - name: Upload Linux GPG signature when configured
        if: env.LINUX_GPG_SIGNING_CONFIGURED == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          signature="HWControl-${RELEASE_TAG}-Linux-x64.sha256.asc"
          test -s "$signature"
          gh release upload "$RELEASE_TAG" "$signature" --repo "$GITHUB_REPOSITORY" --clobber


name: Publish platform release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-linux'
      - 'v[0-9]+.[0-9]+.[0-9]+-windows'
      - 'v[0-9]+.[0-9]+.[0-9]+-macos'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-linux:
    if: endsWith(github.ref_name, '-linux')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev dpkg-dev zstd
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Prepare Linux Flutter project
        working-directory: gui_dashboard
        run: |
          flutter create --platforms=linux --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
      - name: Build Linux dashboard
        working-directory: gui_dashboard
        run: flutter build linux --release -t lib/installer_main.dart
      - name: Build Linux packages
        run: |
          set -euo pipefail
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          package_dir="package/HWControl-${{ github.ref_name }}-Linux-x64"
          mkdir -p "$package_dir"
          install -m 0755 build/ai_core/ai_engine "$package_dir/ai_engine"
          (cd bridge_service && go build -trimpath -ldflags="-s -w" -o "../$package_dir/bridge-service" ./src)
          cp -R gui_dashboard/build/linux/x64/release/bundle "$package_dir/dashboard"
          cp README.md SECURITY.md THIRD_PARTY_NOTICES "$package_dir/"
          cp -R deploy/linux "$package_dir/deploy"
          tar -czf "HWControl-${{ github.ref_name }}-Linux-x64.tar.gz" -C package "HWControl-${{ github.ref_name }}-Linux-x64"
          tar -cf "HWControl-${{ github.ref_name }}-Linux-x64.tar" -C package "HWControl-${{ github.ref_name }}-Linux-x64"
          zstd -f "HWControl-${{ github.ref_name }}-Linux-x64.tar" -o "HWControl-${{ github.ref_name }}-Linux-x64.tar.zst"
          rm -f "HWControl-${{ github.ref_name }}-Linux-x64.tar"
          deb_root="package/deb"
          mkdir -p "$deb_root/DEBIAN" "$deb_root/opt/hwcontrol"
          cp -R "$package_dir/." "$deb_root/opt/hwcontrol/"
          version="${GITHUB_REF_NAME#v}"
          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: hwcontrol
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: HWControl maintainers
          Description: HWControl hardware monitoring and control suite
          EOF
          dpkg-deb --build "$deb_root" "HWControl-${{ github.ref_name }}-Linux-x64.deb"
          sha256sum "HWControl-${{ github.ref_name }}-Linux-x64.tar.gz" "HWControl-${{ github.ref_name }}-Linux-x64.tar.zst" "HWControl-${{ github.ref_name }}-Linux-x64.deb" > "HWControl-${{ github.ref_name }}-Linux-x64.sha256"
          tar -tzf "HWControl-${{ github.ref_name }}-Linux-x64.tar.gz" >/dev/null
          zstd -t "HWControl-${{ github.ref_name }}-Linux-x64.tar.zst"
          dpkg-deb --info "HWControl-${{ github.ref_name }}-Linux-x64.deb" >/dev/null
          sha256sum -c "HWControl-${{ github.ref_name }}-Linux-x64.sha256"
      - name: Generate Linux package provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            HWControl-${{ github.ref_name }}-Linux-x64.tar.gz
            HWControl-${{ github.ref_name }}-Linux-x64.tar.zst
            HWControl-${{ github.ref_name }}-Linux-x64.deb
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-Linux-x64
          path: |
            HWControl-${{ github.ref_name }}-Linux-x64.tar.gz
            HWControl-${{ github.ref_name }}-Linux-x64.tar.zst
            HWControl-${{ github.ref_name }}-Linux-x64.deb
            HWControl-${{ github.ref_name }}-Linux-x64.sha256

  build-windows:
    if: endsWith(github.ref_name, '-windows')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Windows Flutter project
        working-directory: gui_dashboard
        shell: pwsh
        run: |
          flutter create --platforms=windows --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
      - name: Build Windows binaries
        shell: pwsh
        run: |
          cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build-windows --config Release --parallel 2
          Push-Location bridge_service
          go test ./...
          go build -trimpath -ldflags="-s -w" -o ../bridge-service.exe ./src
          Pop-Location
          Push-Location gui_dashboard
          flutter analyze
          flutter test
          flutter build windows --release -t lib/installer_main.dart
          Pop-Location
          $packageDir = "package/HWControl-${{ github.ref_name }}-Windows-x64"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item build-windows/ai_core/Release/ai_engine.exe "$packageDir/ai_engine.exe"
          Copy-Item -Recurse gui_dashboard/build/windows/x64/runner/Release "$packageDir/dashboard"
          Copy-Item gui_dashboard/build/windows/x64/runner/Release/hwcontrol_dashboard.exe "$packageDir/HWControl.exe"
          Copy-Item bridge-service.exe "$packageDir/bridge-service.exe"
          Copy-Item README.md, SECURITY.md, THIRD_PARTY_NOTICES $packageDir
          Copy-Item -Recurse deploy/windows "$packageDir/deploy"
          if (-not (Test-Path "$packageDir/HWControl.exe")) { throw 'HWControl.exe missing from Windows package' }
          if (-not (Test-Path "$packageDir/bridge-service.exe")) { throw 'bridge-service.exe missing from Windows package' }
          if (-not (Test-Path "$packageDir/ai_engine.exe")) { throw 'ai_engine.exe missing from Windows package' }
      - name: Locate SignTool
        id: signtool
        if: ${{ env.WINDOWS_CERTIFICATE_B64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        env:
          WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $tool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $tool) {
            $tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $tool) { throw 'SignTool was not found on the Windows runner.' }
          "path=$($tool.Source ?? $tool.FullName)" >> $env:GITHUB_OUTPUT
      - name: Sign Windows binaries
        if: ${{ env.WINDOWS_CERTIFICATE_B64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        env:
          WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP 'hwcontrol-code-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_B64))
          $packageDir = "package/HWControl-${{ github.ref_name }}-Windows-x64"
          $files = Get-ChildItem $packageDir -Recurse -File | Where-Object { $_.Extension -in '.exe', '.dll' }
          if (-not $files) { throw 'No Windows PE files were found to sign.' }
          foreach ($file in $files) {
            & $env:SIGNTOOL sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $cert /p $env:WINDOWS_CERTIFICATE_PASSWORD /d 'HWControl' $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($file.FullName)" }
            & $env:SIGNTOOL verify /pa /all /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $($file.FullName)" }
          }
          Remove-Item $cert -Force
      - name: Package Windows release
        shell: pwsh
        run: |
          $packageDir = "package/HWControl-${{ github.ref_name }}-Windows-x64"
          Compress-Archive -Path "$packageDir/*" -DestinationPath "HWControl-${{ github.ref_name }}-Windows-x64.zip"
          Expand-Archive -Path "HWControl-${{ github.ref_name }}-Windows-x64.zip" -DestinationPath verify-zip -Force
          if (-not (Test-Path "verify-zip/$packageDir/dashboard")) { throw 'dashboard missing from Windows package' }
          if (-not (Test-Path "verify-zip/$packageDir/HWControl.exe")) { throw 'HWControl.exe missing from Windows package' }
          dotnet tool install --global wix --version 6.0.2 --add-source https://api.nuget.org/v3/index.json
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          $version = "${{ github.ref_name }}" -replace '^v', '' -replace '-windows$', ''
          wix build deploy/windows/HWControl.wxs -arch x64 -d Version=$version -d PackageDir=$packageDir -o "HWControl-${{ github.ref_name }}-Windows-x64.msi"
          if (-not (Test-Path "HWControl-${{ github.ref_name }}-Windows-x64.msi")) { throw 'MSI was not produced' }
      - name: Sign Windows MSI
        if: ${{ env.WINDOWS_CERTIFICATE_B64 != '' && env.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        env:
          WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          SIGNTOOL: ${{ steps.signtool.outputs.path }}
        shell: pwsh
        run: |
          $cert = Join-Path $env:RUNNER_TEMP 'hwcontrol-code-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_B64))
          $msi = "HWControl-${{ github.ref_name }}-Windows-x64.msi"
          & $env:SIGNTOOL sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $cert /p $env:WINDOWS_CERTIFICATE_PASSWORD /d 'HWControl' $msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed.' }
          & $env:SIGNTOOL verify /pa /all /v $msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI signature verification failed.' }
          Remove-Item $cert -Force
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          $zipHash = (Get-FileHash "HWControl-${{ github.ref_name }}-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          $msiHash = (Get-FileHash "HWControl-${{ github.ref_name }}-Windows-x64.msi" -Algorithm SHA256).Hash.ToLower()
          Set-Content "HWControl-${{ github.ref_name }}-Windows-x64.sha256" @(
            "$zipHash  HWControl-${{ github.ref_name }}-Windows-x64.zip",
            "$msiHash  HWControl-${{ github.ref_name }}-Windows-x64.msi"
          )
          $shaCheck = Get-Content "HWControl-${{ github.ref_name }}-Windows-x64.sha256"
          if ($shaCheck.Count -ne 2) { throw 'Windows checksum manifest must contain ZIP and MSI entries' }
      - name: Generate Windows package provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            HWControl-${{ github.ref_name }}-Windows-x64.zip
            HWControl-${{ github.ref_name }}-Windows-x64.msi
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-Windows-x64
          path: |
            HWControl-${{ github.ref_name }}-Windows-x64.zip
            HWControl-${{ github.ref_name }}-Windows-x64.sha256
            HWControl-${{ github.ref_name }}-Windows-x64.msi

  build-macos:
    if: endsWith(github.ref_name, '-macos')
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare macOS Flutter project
        working-directory: gui_dashboard
        run: |
          flutter create --platforms=macos --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
      - name: Build macOS dashboard and packages
        run: |
          set -euo pipefail
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          (cd bridge_service && go test ./... && go build -trimpath -ldflags="-s -w" -o ../bridge-service ./src)
          (cd gui_dashboard && flutter analyze && flutter test && flutter build macos --release -t lib/installer_main.dart)
          version="${GITHUB_REF_NAME#v}"
          version="${version%-macos}"
          package_dir="package/HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon"
          rm -rf "$package_dir"
          mkdir -p "$package_dir"
          cp build/ai_core/ai_engine "$package_dir/ai_engine"
          cp bridge-service "$package_dir/bridge-service"
          cp -R gui_dashboard/build/macos/Build/Products/Release/hwcontrol_dashboard.app "$package_dir/HWControl.app"
          cp README.md SECURITY.md THIRD_PARTY_NOTICES "$package_dir/"
          cp -R deploy/macos "$package_dir/deploy"
          chmod 0755 deploy/macos/pkg-scripts/preinstall deploy/macos/pkg-scripts/postinstall
          test -x deploy/macos/pkg-scripts/preinstall
          test -x deploy/macos/pkg-scripts/postinstall
          pkgbuild --root "$package_dir" --identifier com.hwcontrol.app --version "$version" --install-location /Applications/HWControl --scripts deploy/macos/pkg-scripts "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.pkg"
          hdiutil create -volname "HWControl $GITHUB_REF_NAME" -srcfolder "$package_dir" -ov -format UDZO "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.dmg"
          shasum -a 256 "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.pkg" "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.dmg" > "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.sha256"
          pkgutil --check-signature "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.pkg" || true
          hdiutil verify "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.dmg"
          shasum -a 256 -c "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.sha256"
          sudo installer -pkg "HWControl-${GITHUB_REF_NAME}-macOS-AppleSilicon.pkg" -target /
          test -x /Applications/HWControl/bridge-service
          test -x /Applications/HWControl/ai_engine
          test -d /Applications/HWControl/HWControl.app
          sudo rm -rf /Applications/HWControl
          sudo rm -f /Library/LaunchDaemons/com.hwcontrol.bridge.plist
      - name: Generate macOS package provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            HWControl-${{ github.ref_name }}-macOS-AppleSilicon.pkg
            HWControl-${{ github.ref_name }}-macOS-AppleSilicon.dmg
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-macOS-AppleSilicon
          path: |
            HWControl-${{ github.ref_name }}-macOS-AppleSilicon.pkg
            HWControl-${{ github.ref_name }}-macOS-AppleSilicon.dmg
            HWControl-${{ github.ref_name }}-macOS-AppleSilicon.sha256

  release:
    needs: [build-linux, build-windows, build-macos]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create operating-system release
        uses: softprops/action-gh-release@v2
        with:
          name: HWControl ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.tar.zst
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.pkg
            dist/**/*.deb
            dist/**/*.sha256
            dist/**/*.msi

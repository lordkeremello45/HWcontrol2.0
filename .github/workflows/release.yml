name: Publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux-x64
          - os: macos-13
            platform: macOS-Intel-x64
          - os: macos-14
            platform: macOS-AppleSilicon-arm64
          - os: windows-2022
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Configure C++
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          else
            cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          fi
      - name: Build C++ engine
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            cmake --build build-windows --config Release --parallel 2
          else
            cmake --build build --parallel 2
          fi
      - name: Build and package applications
        shell: bash
        run: |
          package_dir="package/hwcontrol-${{ matrix.platform }}"
          mkdir -p "$package_dir"
          if [ "${{ matrix.os }}" = "windows-2022" ]; then
            cp build-windows/ai_core/Release/ai_engine.exe "$package_dir/ai_engine.exe"
            go build -trimpath -ldflags="-s -w" -o "$package_dir/bridge-service.exe" ./bridge_service/src
          else
            cp build/ai_core/ai_engine "$package_dir/ai_engine"
            go build -trimpath -ldflags="-s -w" -o "$package_dir/bridge-service" ./bridge_service/src
          fi
          cp README.md SECURITY.md "$package_dir/"
          tar -czf "HWControl-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" -C package "hwcontrol-${{ matrix.platform }}"
      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-${{ matrix.platform }}
          path: HWControl-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub release with packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Platform packages:
            - `HWControl-${{ github.ref_name }}-Windows-x64.tar.gz` = Windows 64-bit
            - `HWControl-${{ github.ref_name }}-Linux-x64.tar.gz` = Linux 64-bit
            - `HWControl-${{ github.ref_name }}-macOS-Intel-x64.tar.gz` = macOS Intel
            - `HWControl-${{ github.ref_name }}-macOS-AppleSilicon-arm64.tar.gz` = macOS Apple Silicon (M1/M2/M3/M4)
          files: dist/**/*.tar.gz

name: Publish platform release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-linux'
      - 'v[0-9]+.[0-9]+.[0-9]+-windows'
      - 'v[0-9]+.[0-9]+.[0-9]+-macos'

permissions:
  contents: write

jobs:
  build-linux:
    if: endsWith(github.ref_name, '-linux')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev dpkg-dev
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Linux dashboard
        working-directory: gui_dashboard
        run: |
          flutter create --platforms=linux .
          flutter pub get
          flutter build linux --release
      - name: Build Linux package
        run: |
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          package_dir="package/HWControl-${{ github.ref_name }}-Linux-x64"
          mkdir -p "$package_dir"
          cp build/ai_core/ai_engine "$package_dir/ai_engine"
          (cd bridge_service && go build -trimpath -ldflags="-s -w" -o "../$package_dir/bridge-service" ./src)
          cp -R gui_dashboard/build/linux/x64/release/bundle "$package_dir/dashboard"
          cp README.md SECURITY.md "$package_dir/"
          cp THIRD_PARTY_NOTICES "$package_dir/"
          cp -R deploy/linux "$package_dir/deploy"
          tar -czf "HWControl-${{ github.ref_name }}-Linux-x64.tar.gz" -C package "HWControl-${{ github.ref_name }}-Linux-x64"
          deb_root="package/deb"
          mkdir -p "$deb_root/DEBIAN" "$deb_root/opt/hwcontrol"
          cp -R "$package_dir/." "$deb_root/opt/hwcontrol/"
          version="${GITHUB_REF_NAME#v}"
          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: hwcontrol
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: HWControl maintainers
          Description: HWControl hardware monitoring and control suite
          EOF
          dpkg-deb --build "$deb_root" "HWControl-${{ github.ref_name }}-Linux-x64.deb"
          sha256sum "HWControl-${{ github.ref_name }}-Linux-x64.tar.gz" "HWControl-${{ github.ref_name }}-Linux-x64.deb" > "HWControl-${{ github.ref_name }}-Linux-x64.sha256"
          tar -tzf "HWControl-${{ github.ref_name }}-Linux-x64.tar.gz" >/dev/null
          dpkg-deb --info "HWControl-${{ github.ref_name }}-Linux-x64.deb" >/dev/null
          sha256sum -c "HWControl-${{ github.ref_name }}-Linux-x64.sha256"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-Linux-x64
          path: |
            HWControl-${{ github.ref_name }}-Linux-x64.tar.gz
            HWControl-${{ github.ref_name }}-Linux-x64.deb
            HWControl-${{ github.ref_name }}-Linux-x64.sha256

  build-windows:
    if: endsWith(github.ref_name, '-windows')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows dashboard
        working-directory: gui_dashboard
        shell: pwsh
        run: |
          flutter create --platforms=windows .
          flutter pub get
          flutter build windows --release
      - name: Build Windows package
        shell: pwsh
        run: |
          cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build-windows --config Release --parallel 2
          $packageDir = "package/HWControl-${{ github.ref_name }}-Windows-x64"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item build-windows/ai_core/Release/ai_engine.exe "$packageDir/ai_engine.exe"
          Copy-Item -Recurse gui_dashboard/build/windows/x64/runner/Release "$packageDir/dashboard"
          Push-Location bridge_service
          go build -trimpath -ldflags="-s -w" -o "../$packageDir/bridge-service.exe" ./src
          Pop-Location
          Copy-Item README.md, SECURITY.md $packageDir
          Copy-Item THIRD_PARTY_NOTICES $packageDir
          Copy-Item -Recurse deploy/windows "$packageDir/deploy"
          Compress-Archive -Path "$packageDir/*" -DestinationPath "HWControl-${{ github.ref_name }}-Windows-x64.zip"
          (Get-FileHash "HWControl-${{ github.ref_name }}-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower() + "  HWControl-${{ github.ref_name }}-Windows-x64.zip" | Set-Content "HWControl-${{ github.ref_name }}-Windows-x64.sha256"
          Expand-Archive -Path "HWControl-${{ github.ref_name }}-Windows-x64.zip" -DestinationPath verify-zip -Force
          if (-not (Test-Path "verify-zip/$packageDir/dashboard")) { throw "dashboard missing from Windows package" }
          $actual = (Get-FileHash "HWControl-${{ github.ref_name }}-Windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          $expected = (Get-Content "HWControl-${{ github.ref_name }}-Windows-x64.sha256").Split()[0]
          if ($actual -ne $expected) { throw "Windows checksum mismatch" }
          choco install wixtoolset --no-progress -y
          $version = "${{ github.ref_name }}" -replace '^v', '' -replace '-windows$', ''
          wix build deploy/windows/HWControl.wxs -d Version=$version -d PackageDir=$packageDir -o "HWControl-${{ github.ref_name }}-Windows-x64.msi"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-Windows-x64
          path: |
            HWControl-${{ github.ref_name }}-Windows-x64.zip
            HWControl-${{ github.ref_name }}-Windows-x64.sha256
            HWControl-${{ github.ref_name }}-Windows-x64.msi

  build-macos:
    if: endsWith(github.ref_name, '-macos')
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS dashboard
        working-directory: gui_dashboard
        run: |
          flutter create --platforms=macos .
          flutter pub get
          flutter build macos --release
      - name: Build macOS package
        run: |
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          package_dir="package/HWControl-${{ github.ref_name }}-macOS-AppleSilicon"
          mkdir -p "$package_dir"
          cp build/ai_core/ai_engine "$package_dir/ai_engine"
          (cd bridge_service && go build -trimpath -ldflags="-s -w" -o "../$package_dir/bridge-service" ./src)
          cp -R gui_dashboard/build/macos/Build/Products/Release/hwcontrol_dashboard.app "$package_dir/dashboard.app"
          cp README.md SECURITY.md "$package_dir/"
          cp THIRD_PARTY_NOTICES "$package_dir/"
          cp -R deploy/macos "$package_dir/deploy"
          hdiutil create -volname "HWControl ${{ github.ref_name }}" -srcfolder "$package_dir" -ov -format UDZO "HWControl-${{ github.ref_name }}-macOS-AppleSilicon.dmg"
          shasum -a 256 "HWControl-${{ github.ref_name }}-macOS-AppleSilicon.dmg" > "HWControl-${{ github.ref_name }}-macOS-AppleSilicon.sha256"
          hdiutil verify "HWControl-${{ github.ref_name }}-macOS-AppleSilicon.dmg"
          shasum -a 256 -c "HWControl-${{ github.ref_name }}-macOS-AppleSilicon.sha256"
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-macOS-AppleSilicon
          path: |
            HWControl-${{ github.ref_name }}-macOS-AppleSilicon.dmg
            HWControl-${{ github.ref_name }}-macOS-AppleSilicon.sha256

  release:
    needs: [build-linux, build-windows, build-macos]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create operating-system release
        uses: softprops/action-gh-release@v2
        with:
          name: HWControl ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.sha256
            dist/**/*.msi

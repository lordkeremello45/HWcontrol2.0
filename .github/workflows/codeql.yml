name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: go
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Install native build dependencies
        if: matrix.language == 'c-cpp'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config libasound2-dev

      - name: Configure C++ project
        if: matrix.language == 'c-cpp'
        run: cmake -S . -B build-codeql -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF

      - name: Build C++ project for CodeQL
        if: matrix.language == 'c-cpp'
        run: cmake --build build-codeql --parallel 2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

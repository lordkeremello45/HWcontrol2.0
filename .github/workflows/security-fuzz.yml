name: Security boundary fuzzing

on:
  push:
    branches: [main]
    paths:
      - "bridge_service/src/**"
      - ".github/workflows/security-fuzz.yml"
  pull_request:
    branches: [main]
    paths:
      - "bridge_service/src/**"
      - ".github/workflows/security-fuzz.yml"
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-boundary-fuzz:
    name: Fuzz Go IPC security boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1580a326750d5838078e36cf38b85af677262 # v5.6.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false

      - name: Fuzz command authentication
        working-directory: bridge_service
        run: go test -run='^$' -fuzz='^FuzzCommandAuthenticationCoversPayload$' -fuzztime=20s ./src

      - name: Fuzz strict JSON command decoding
        working-directory: bridge_service
        run: go test -run='^$' -fuzz='^FuzzDecodeCommandStrict$' -fuzztime=20s ./src

      - name: Fuzz bounded request parsing
        working-directory: bridge_service
        run: go test -run='^$' -fuzz='^FuzzReadBoundedRequest$' -fuzztime=20s ./src

      - name: Fuzz audio profile decoding
        working-directory: bridge_service
        run: go test -run='^$' -fuzz='^FuzzAudioStudioJSONPayload$' -fuzztime=20s ./src

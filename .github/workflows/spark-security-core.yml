name: SPARK security core

on:
  push:
    branches: [main]
    paths:
      - "security/spark-core/**"
      - ".github/workflows/spark-security-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "security/spark-core/**"
      - ".github/workflows/spark-security-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-security-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Build, test and formally verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: security/spark-core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned GNAT/SPARK toolchain
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /opt/hwcontrol-ada
          cd /tmp

          curl --fail --silent --show-error --location \
            https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnat-15.3.0-1/gnat-x86_64-linux-15.3.0-1.tar.gz \
            -o gnat.tar.gz
          echo "a6af58cbe96b8ed92b9d9929f89547c1be2ce96b86bb86422026074094429001  gnat.tar.gz" | sha256sum -c -

          curl --fail --silent --show-error --location \
            https://github.com/alire-project/GNAT-FSF-builds/releases/download/gprbuild-26.0.0-1/gprbuild-x86_64-linux-26.0.0-1.tar.gz \
            -o gprbuild.tar.gz
          echo "e3f27f2515ec04d963f6badade6595993b1c091ba15d1919a7c75aad1b7ed49b  gprbuild.tar.gz" | sha256sum -c -

          curl --fail --silent --show-error --location \
            https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-16.1.0-1/gnatprove-x86_64-linux-16.1.0-1.tar.gz \
            -o gnatprove.tar.gz
          echo "82528bef29857e239373fcc36732837d743f5a00805d502c70455422ffc97191  gnatprove.tar.gz" | sha256sum -c -

          tar -xzf gnat.tar.gz -C /opt/hwcontrol-ada
          tar -xzf gprbuild.tar.gz -C /opt/hwcontrol-ada
          tar -xzf gnatprove.tar.gz -C /opt/hwcontrol-ada

          GNAT_BIN="/opt/hwcontrol-ada/gnat-x86_64-linux-15.3.0-1/bin"
          GPRBUILD_BIN="/opt/hwcontrol-ada/gprbuild-x86_64-linux-26.0.0-1/bin"
          GNATPROVE_BIN="/opt/hwcontrol-ada/gnatprove-x86_64-linux-16.1.0-1/bin"

          test -x "$GNAT_BIN/gnatmake"
          test -x "$GPRBUILD_BIN/gprbuild"
          test -x "$GNATPROVE_BIN/gnatprove"

          echo "$GNAT_BIN" >> "$GITHUB_PATH"
          echo "$GPRBUILD_BIN" >> "$GITHUB_PATH"
          echo "$GNATPROVE_BIN" >> "$GITHUB_PATH"

          export PATH="$GNAT_BIN:$GPRBUILD_BIN:$GNATPROVE_BIN:$PATH"
          gnatmake -v
          gprbuild --version
          gnatprove --version

      - name: Build
        run: gprbuild -P security_core.gpr -j0

      - name: Runtime tests
        run: ./bin/security_core_test

      - name: GNATprove formal verification
        run: gnatprove -P security_core.gpr --mode=all --proof-warnings=on --level=2

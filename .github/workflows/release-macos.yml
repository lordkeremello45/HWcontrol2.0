name: Publish macOS release

on:
  push:
    branches:
      - main
    tags:
      - 'v*-macos'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing platform tag, for example vX.Y.Z-macos or vX.Y.Z-beta-macos'
        required: true
        type: string
      source_ref:
        description: 'Source branch or commit to build'
        required: true
        default: main
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FLUTTER_VERSION: 3.41.9 # Avoid known macOS release AOT crash in Flutter 3.47.x (flutter/flutter#191575).
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build-macos:
    name: Build and package macOS arm64
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Resolve checked-out source commit
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve checked-out source commit" >&2; exit 1; }
          echo "SOURCE_COMMIT_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Verify existing release tag is immutable
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          remote_ref="$(git ls-remote origin "refs/tags/$RELEASE_TAG")"
          [[ -n "$remote_ref" ]] || { echo "Release tag $RELEASE_TAG does not exist; refusing to publish an untagged commit" >&2; exit 1; }
          if [[ -n "$remote_ref" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tag_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
            source_sha="$(git rev-parse HEAD)"
            [[ "$tag_sha" == "$source_sha" ]] || { echo "Tag $RELEASE_TAG points at $tag_sha, not source commit $source_sha" >&2; exit 1; }
          fi

      - name: Resolve main-branch package version
        id: resolve-main-tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' gui_dashboard/pubspec.yaml | head -n1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Could not read numeric application version from pubspec.yaml" >&2; exit 1; }
          tag="v${version}-main-${GITHUB_SHA}-macos"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Main-branch package tag: $tag"

      - name: Validate release tag format
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?-macos$ ]] || { echo "Invalid macos release tag: $RELEASE_TAG" >&2; exit 1; }

      - name: Validate app version against package tag
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' gui_dashboard/pubspec.yaml | head -n1)"
          tag_version="${RELEASE_TAG#v}"
          tag_version="${tag_version%%-*}"
          [[ "$app_version" == "$tag_version" ]] || { echo "Package tag version $tag_version does not match app version $app_version" >&2; exit 1; }

      - name: Install tooling
        run: brew install zstd

      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: ARM64

      - name: Build and test native/bridge/dashboard
        run: |
          set -euo pipefail
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          (cd bridge_service && go vet ./... && go test -count=1 ./... && go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service ./src && go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../security-guardian ./security_guardian)
          (cd gui_dashboard && flutter create --platforms=macos --no-pub . && git restore pubspec.yaml test/widget_test.dart && sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = HWControl/' macos/Runner/Configs/AppInfo.xcconfig && sed -i '' 's/^PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.hwcontrol.hwcontrol/' macos/Runner/Configs/AppInfo.xcconfig && flutter pub get && flutter analyze && flutter test --no-pub && flutter build macos --release -t lib/installer_main.dart --dart-define=HWCONTROL_RELEASE_TRUST=official)

      - name: Assemble macOS installer root
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"; version="${version%%-*}"
          rm -rf pkg-root dmg-root
          mkdir -p pkg-root/Applications/HWControl dmg-root
          cp -R gui_dashboard/build/macos/Build/Products/Release/HWControl.app pkg-root/Applications/HWControl/
          install -m 0755 build/ai_core/ai_engine pkg-root/Applications/HWControl/ai_engine
          install -m 0755 build/audio_core/hwcontrol_audio_probe pkg-root/Applications/HWControl/hwcontrol_audio_probe
          install -m 0755 bridge-service pkg-root/Applications/HWControl/bridge-service
           install -m 0755 security-guardian pkg-root/Applications/HWControl/security-guardian
          install -m 0644 deploy/macos/com.hwcontrol.bridge.plist pkg-root/Applications/HWControl/com.hwcontrol.bridge.plist
          cp README.md SECURITY.md THIRD_PARTY_NOTICES pkg-root/Applications/HWControl/
          cp -R deploy/macos pkg-root/Applications/HWControl/deploy
          pkgbuild --root pkg-root --identifier com.hwcontrol.hwcontrol --version "$version" --scripts deploy/macos/pkg-scripts --install-location / "HWControl-${tag}-macOS-AppleSilicon.pkg"
          cp -R pkg-root/Applications/HWControl/HWControl.app dmg-root/
          cp "HWControl-${tag}-macOS-AppleSilicon.pkg" dmg-root/
          hdiutil create -volname HWControl -srcfolder dmg-root -ov -format UDZO "HWControl-${tag}-macOS-AppleSilicon.dmg"

      - name: Sign, notarize and verify macOS release when credentials are configured
        env:
          APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          names=(APPLE_CERTIFICATE_P12_B64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_INSTALLER_IDENTITY APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER)
          configured=0
          for name in "${names[@]}"; do
            value="${!name:-}"
            if [[ -n "$value" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo 'APPLE_SIGNING_CONFIGURED=false' >> "$GITHUB_ENV"
            echo 'Apple Developer ID signing/notarization secrets are absent; this artifact will remain unsigned and final-release readiness will reject it.'
            exit 0
          fi
          if [[ "$configured" -ne "${#names[@]}" ]]; then
            echo 'Apple signing configuration is incomplete; refusing to publish a partially signed release.' >&2
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/hwcontrol-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12_path="$RUNNER_TEMP/hwcontrol-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          pkg="HWControl-${RELEASE_TAG}-macOS-AppleSilicon.pkg"
          dmg="HWControl-${RELEASE_TAG}-macOS-AppleSilicon.dmg"
          app_root="$PWD/pkg-root/Applications/HWControl"
          app="$app_root/HWControl.app"
          unsigned_pkg="$RUNNER_TEMP/HWControl-unsigned.pkg"
          signed_pkg="$RUNNER_TEMP/HWControl-signed.pkg"

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$p12_path" "$api_key_path" "$unsigned_pkg" "$signed_pkg"
          }
          trap cleanup EXIT

          printf '%s' "$APPLE_CERTIFICATE_P12_B64" | base64 --decode > "$p12_path"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$api_key_path"
          test -s "$p12_path"
          test -s "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db

          for binary in "$app_root/ai_engine" "$app_root/hwcontrol_audio_probe" "$app_root/bridge-service" "$app_root/security-guardian"; do
            test -x "$binary"
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
          done
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          version="${RELEASE_TAG#v}"; version="${version%%-*}"
          pkgbuild --root pkg-root --identifier com.hwcontrol.hwcontrol --version "$version" --scripts deploy/macos/pkg-scripts --install-location / "$unsigned_pkg"
          productsign --sign "$APPLE_INSTALLER_IDENTITY" "$unsigned_pkg" "$signed_pkg"
          mv "$signed_pkg" "$pkg"
          pkgutil --check-signature "$pkg"
          xcrun notarytool submit "$pkg" --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"

          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R "$app" dmg-root/
          cp "$pkg" dmg-root/
          hdiutil create -volname HWControl -srcfolder dmg-root -ov -format UDZO "$dmg"
          xcrun notarytool submit "$dmg" --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type install --verbose "$pkg"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo 'APPLE_SIGNING_CONFIGURED=true' >> "$GITHUB_ENV"

      - name: Package and validate standalone macOS app archive
        run: |
          set -euo pipefail
          app_root="pkg-root/Applications/HWControl"
          app="$app_root/HWControl.app"
          archive="HWControl-${RELEASE_TAG}-macOS-AppleSilicon-app-bundle.zip"
          test -d "$app/Contents/MacOS"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test -n "$executable"
          test -x "$app/Contents/MacOS/$executable"
          test -x "$app_root/ai_engine"
          test -x "$app_root/hwcontrol_audio_probe"
          test -x "$app_root/bridge-service"
          test -x "$app_root/security-guardian"
          ditto -c -k --sequesterRsrc --keepParent "$app_root" "$archive"
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fq 'HWControl/HWControl.app/Contents/Info.plist'
          unzip -Z1 "$archive" | grep -Fq 'HWControl/bridge-service'

      - name: Smoke-test PKG install and uninstall
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          sudo installer -pkg "HWControl-${tag}-macOS-AppleSilicon.pkg" -target /
          test -d /Applications/HWControl/HWControl.app
          test -x /Applications/HWControl/bridge-service
          test -x /Applications/HWControl/hwcontrol_audio_probe
          test -x /Applications/HWControl/ai_engine
          test -x /Applications/HWControl/security-guardian
          test -s '/Library/Application Support/HWControl/bridge.key'
          test -f '/Library/Application Support/HWControl/security/canary/bridger.key'
          test -f /Library/LaunchDaemons/com.hwcontrol.security-guardian.plist
          test -f /Library/LaunchDaemons/com.hwcontrol.bridge.plist
          sudo launchctl print system/com.hwcontrol.bridge >/dev/null
          sudo launchctl print system/com.hwcontrol.security-guardian >/dev/null
          sudo launchctl bootout system /Library/LaunchDaemons/com.hwcontrol.security-guardian.plist || true
          sudo launchctl bootout system /Library/LaunchDaemons/com.hwcontrol.bridge.plist || true
          sudo rm -f /Library/LaunchDaemons/com.hwcontrol.security-guardian.plist /Library/LaunchDaemons/com.hwcontrol.bridge.plist
          sudo rm -rf /Applications/HWControl
          sudo rm -rf '/Library/Application Support/HWControl'
          test ! -e /Applications/HWControl

      - name: Verify package hashes
        run: |
          set -euo pipefail
          shasum -a 256 "HWControl-${RELEASE_TAG}-macOS-AppleSilicon.pkg" "HWControl-${RELEASE_TAG}-macOS-AppleSilicon.dmg" "HWControl-${RELEASE_TAG}-macOS-AppleSilicon-app-bundle.zip" > "HWControl-${RELEASE_TAG}-macOS-AppleSilicon.sha256"
          shasum -a 256 -c "HWControl-${RELEASE_TAG}-macOS-AppleSilicon.sha256"

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-macOS-AppleSilicon.pkg
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-macOS-AppleSilicon.dmg
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-macOS-AppleSilicon-app-bundle.zip
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-macOS-AppleSilicon.sha256

      - name: Upload macOS main-branch packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-main-${{ github.sha }}-macOS-AppleSilicon
          path: |
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-macOS-AppleSilicon.pkg
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-macOS-AppleSilicon.dmg
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-macOS-AppleSilicon-app-bundle.zip
            HWControl-${{ steps.resolve-main-tag.outputs.tag }}-macOS-AppleSilicon.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish macOS release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ startsWith(env.RELEASE_TAG, 'v0.3.0-') && 'HWcontrol2.0 Beta — macOS' || format('HWControl {0}', env.RELEASE_TAG) }}
          tag_name: ${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}
          target_commitish: ${{ env.SOURCE_COMMIT_SHA }}
          overwrite_files: true
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta') }}
          files: |
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-macOS-AppleSilicon.pkg
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-macOS-AppleSilicon.dmg
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-macOS-AppleSilicon-app-bundle.zip
            HWControl-${{ steps.resolve-main-tag.outputs.tag || env.RELEASE_TAG }}-macOS-AppleSilicon.sha256
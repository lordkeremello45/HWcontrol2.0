name: One-time Go formatting remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gofmt-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Apply gofmt
        working-directory: bridge_service
        run: gofmt -w .
      - name: Commit formatting and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bridge_service
          git rm .github/workflows/gofmt-bootstrap.yml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m 'style: format bridge service with gofmt'
          git push origin HEAD:main

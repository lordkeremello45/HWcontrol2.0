name: Temporary Go formatting repair

on:
  push:
    branches:
      - feat/audio-controller-studio-core

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[apply-gofmt]')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/audio-controller-studio-core
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Apply gofmt to bridge sources
        working-directory: bridge_service
        run: gofmt -w src security_guardian
      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "Go sources already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge_service/src bridge_service/security_guardian
          git commit -m "[skip ci] chore(go): apply gofmt"
          git push origin HEAD:feat/audio-controller-studio-core

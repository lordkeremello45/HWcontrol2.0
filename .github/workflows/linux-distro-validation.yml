name: Linux distro validation

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'bridge_service/**'
      - 'gui_dashboard/**'
      - 'installer/**'
      - 'deploy/linux/**'
      - '.github/workflows/linux-distro-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'bridge_service/**'
      - 'gui_dashboard/**'
      - 'installer/**'
      - 'deploy/linux/**'
      - '.github/workflows/linux-distro-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distro-smoke:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            container: ubuntu:22.04
          - name: Ubuntu 24.04
            container: ubuntu:24.04
          - name: Debian 12
            container: debian:12
          - name: Fedora 42
            container: fedora:42
          - name: Arch Linux
            container: archlinux:base
          - name: openSUSE Tumbleweed
            container: opensuse/tumbleweed:latest

    container: ${{ matrix.container }}

    steps:
      - name: Install base tooling
        shell: bash
        run: |
          set -euo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git cmake build-essential pkg-config file bash
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y ca-certificates curl git cmake gcc-c++ make pkgconf-pkg-config file bash
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm ca-certificates curl git cmake base-devel pkgconf file bash
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive refresh
            zypper --non-interactive install -y ca-certificates curl git cmake gcc-c++ make pkg-config file bash
          else
            echo 'Unsupported container distribution.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate host architecture
        shell: bash
        run: test "$(uname -m)" = "x86_64"

      - name: Configure native engine
        shell: bash
        run: cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF

      - name: Build native engine
        shell: bash
        run: cmake --build build --parallel 2

      - name: Install Go
        shell: bash
        run: |
          set -euo pipefail
          if command -v go >/dev/null 2>&1; then
            go version
            exit 0
          fi
          curl -fsSL https://go.dev/dl/go1.24.6.linux-amd64.tar.gz -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          export PATH=/usr/local/go/bin:$PATH
          go version

      - name: Test and build bridge
        working-directory: bridge_service
        shell: bash
        run: |
          go test ./...
          # PR merge refs are checked out detached. Go VCS stamping can fail
          # inside these containerized distro smoke jobs; release provenance
          # is handled by the release/attestation pipeline.
          go build -buildvcs=false -trimpath -o bridge-service ./src

      - name: Validate runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' binary; do
            found=1
            if command -v ldd >/dev/null 2>&1; then
              if ldd "$binary" 2>&1 | grep -q 'not found'; then
                echo "Missing runtime dependency: $binary" >&2
                ldd "$binary" >&2 || true
                exit 1
              fi
            fi
          done < <(find bridge_service build -type f -perm -111 -print0 2>/dev/null)
          test "$found" -eq 1

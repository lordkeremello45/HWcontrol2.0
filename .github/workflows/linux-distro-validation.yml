name: Linux distro validation

on:
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'bridge_service/**'
      - 'gui_dashboard/**'
      - 'installer/**'
      - 'deploy/linux/**'
      - '.github/workflows/linux-distro-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'bridge_service/**'
      - 'gui_dashboard/**'
      - 'installer/**'
      - 'deploy/linux/**'
      - '.github/workflows/linux-distro-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distro-smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            os: ubuntu-22.04
          - name: Ubuntu 24.04
            os: ubuntu-24.04
          - name: Debian 12
            os: debian-12
          - name: Fedora 42
            os: ubuntu-24.04
            container: fedora:42
          - name: Arch Linux
            os: ubuntu-24.04
            container: archlinux:base
          - name: openSUSE Tumbleweed
            os: ubuntu-24.04
            container: opensuse/tumbleweed:latest

    container: ${{ matrix.container || '' }}

    steps:
      - name: Install base tooling
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git cmake build-essential pkg-config
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y ca-certificates curl git cmake gcc-c++ make pkgconf-pkg-config
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm ca-certificates curl git cmake base-devel pkgconf
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive refresh
            zypper --non-interactive install -y ca-certificates curl git cmake gcc-c++ make pkg-config
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate host architecture
        run: test "$(uname -m)" = "x86_64"

      - name: Configure native engine
        run: cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF

      - name: Build native engine
        run: cmake --build build --parallel 2

      - name: Install Go
        shell: bash
        run: |
          if command -v go >/dev/null 2>&1; then exit 0; fi
          curl -fsSL https://go.dev/dl/go1.24.6.linux-amd64.tar.gz -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
          export PATH=/usr/local/go/bin:$PATH
          go version

      - name: Test and build bridge
        working-directory: bridge_service
        run: |
          go test ./...
          go build -o bridge-service ./src

      - name: Validate runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          for binary in bridge_service/bridge-service build/*; do
            if [ -f "$binary" ] && file "$binary" 2>/dev/null | grep -q ELF; then
              if command -v ldd >/dev/null 2>&1; then
                ldd "$binary" | grep 'not found' && exit 1 || true
              fi
            fi
          done

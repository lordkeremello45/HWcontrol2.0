name: Microsoft Store MSIX

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packaged MSIX to Microsoft Store'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: microsoft-store-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_PROJECT: gui_dashboard

jobs:
  package:
    name: Build Store MSIX
    runs-on: windows-2022
    outputs:
      package_path: ${{ steps.package.outputs.path }}
      package_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content "$env:FLUTTER_PROJECT/pubspec.yaml" -Raw
          $match = [regex]::Match($pubspec, '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+([0-9]+))?\s*$')
          if (-not $match.Success) { throw 'Unable to read Flutter application version from pubspec.yaml.' }
          $version = "$($match.Groups[1].Value).0"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Store package version: $version"

      - name: Validate Store identity configuration
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:STORE_IDENTITY_NAME)) { $missing += 'STORE_IDENTITY_NAME' }
          if ([string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER)) { $missing += 'STORE_PUBLISHER' }
          if ([string]::IsNullOrWhiteSpace($env:STORE_PUBLISHER_DISPLAY_NAME)) { $missing += 'STORE_PUBLISHER_DISPLAY_NAME' }
          if ([string]::IsNullOrWhiteSpace($env:STORE_PRODUCT_ID)) { $missing += 'STORE_PRODUCT_ID' }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions Variables: $($missing -join ', '). Copy the exact values from Partner Center."
          }

      - name: Install Dart dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter pub get

      - name: Build Flutter Windows release
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter build windows --release

      - name: Configure Store MSIX metadata
        working-directory: ${{ env.FLUTTER_PROJECT }}
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          @"

          msix_config:
            display_name: HWControl
            publisher_display_name: $env:STORE_PUBLISHER_DISPLAY_NAME
            identity_name: $env:STORE_IDENTITY_NAME
            publisher: $env:STORE_PUBLISHER
            msix_version: $env:STORE_VERSION
            architecture: x64
            store: true
            install_certificate: false
            languages: en-us
          "@ | Add-Content pubspec.yaml

      - name: Create Store MSIX
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: dart run msix:create --store --version "${{ steps.version.outputs.version }}" --output-path "build/store"

      - name: Locate MSIX
        id: package
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: |
          $msix = Get-ChildItem build/store -Filter '*.msix' -File -Recurse | Select-Object -First 1
          if (-not $msix) { throw 'MSIX package was not produced.' }
          "path=$($msix.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "MSIX: $($msix.FullName)"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-MSIX-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Microsoft Store
    needs: package
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true
    runs-on: windows-2022
    environment: microsoft-store
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: ${{ env.FLUTTER_PROJECT }}
        shell: pwsh
        run: flutter pub get

      - name: Install Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Microsoft Store CLI
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:AZURE_AD_TENANT_ID)) { $missing += 'AZURE_AD_TENANT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_AD_APPLICATION_CLIENT_ID)) { $missing += 'AZURE_AD_APPLICATION_CLIENT_ID' }
          if ([string]::IsNullOrWhiteSpace($env:AZURE_AD_APPLICATION_SECRET)) { $missing += 'AZURE_AD_APPLICATION_SECRET' }
          if ([string]::IsNullOrWhiteSpace($env:SELLER_ID)) { $missing += 'SELLER_ID' }
          if ($missing.Count -gt 0) { throw "Missing GitHub Environment secrets: $($missing -join ', ')" }
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET --sellerId $env:SELLER_ID

      - name: Package with Microsoft Store CLI
        working-directory: ${{ env.FLUTTER_PROJECT }}
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_VERSION: ${{ needs.package.outputs.package_version }}
        run: |
          @"

          msix_config:
            display_name: HWControl
            publisher_display_name: $env:STORE_PUBLISHER_DISPLAY_NAME
            identity_name: $env:STORE_IDENTITY_NAME
            publisher: $env:STORE_PUBLISHER
            msix_version: $env:STORE_VERSION
            architecture: x64
            store: true
            install_certificate: false
            languages: en-us
          "@ | Add-Content pubspec.yaml
          msstore package .

      - name: Publish package to Microsoft Store
        shell: pwsh
        env:
          STORE_PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_PRODUCT_ID)) { throw 'STORE_PRODUCT_ID is not configured.' }
          msstore publish "${{ github.workspace }}\${{ env.FLUTTER_PROJECT }}" --appId $env:STORE_PRODUCT_ID -v

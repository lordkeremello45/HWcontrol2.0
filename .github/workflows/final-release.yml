name: Final release — all platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable semantic version without v (must match gui_dashboard/pubspec.yaml)"
        required: true
        type: string
        default: "0.3.1"
      source_ref:
        description: "main or a full 40-character commit SHA"
        required: true
        type: string
        default: "main"

permissions:
  contents: write
  actions: write

concurrency:
  group: hwcontrol-final-release
  cancel-in-progress: false

jobs:
  preflight-and-release:
    name: Build, publish and verify stable platform releases
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      SOURCE_REF: ${{ inputs.source_ref }}
      WINDOWS_CERTIFICATE_B64: ${{ secrets.WINDOWS_CERTIFICATE_B64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE_P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
      APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      HWCONTROL_GPG_PRIVATE_KEY_B64: ${{ secrets.HWCONTROL_GPG_PRIVATE_KEY_B64 }}
      HWCONTROL_GPG_PASSPHRASE: ${{ secrets.HWCONTROL_GPG_PASSPHRASE }}
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Validate source, signing credentials and physical hardware evidence
        id: source
        shell: bash
        run: |
          set -euo pipefail
          release_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Version must be semantic numeric form, e.g. 0.3.1." >&2
            exit 1
          }
          [[ "$SOURCE_REF" == "main" || "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Source must be main or a full 40-character commit SHA." >&2
            exit 1
          }

          missing=()
          for name in WINDOWS_CERTIFICATE_B64 WINDOWS_CERTIFICATE_PASSWORD \
            APPLE_CERTIFICATE_P12_B64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_INSTALLER_IDENTITY APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER \
            HWCONTROL_GPG_PRIVATE_KEY_B64 HWCONTROL_GPG_PASSPHRASE APT_GPG_PRIVATE_KEY; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required final-release secret: %s\n' "${missing[@]}" >&2
            echo 'No stable tags or releases were created. Configure the listed repository Actions secrets and rerun.' >&2
            exit 1
          fi

          source_sha="$(gh api "repos/$GH_REPO/commits/$SOURCE_REF" --jq '.sha')"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Could not resolve source commit.' >&2; exit 1; }
          source_version="$(gh api "repos/$GH_REPO/contents/gui_dashboard/pubspec.yaml?ref=$source_sha" --jq '.content' | base64 --decode | sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | head -n1)"
          [[ "$source_version" == "$VERSION" ]] || {
            echo "Requested version $VERSION does not match source version $source_version." >&2
            exit 1
          }

          hardware_matrix="$(gh api "repos/$GH_REPO/contents/docs/HARDWARE-VALIDATION-MATRIX.md?ref=$source_sha" --jq '.content' | base64 --decode)"
          for platform in Windows Linux macOS; do
            if ! grep -Eq "^\\| $platform \\|.*\\| VERIFIED \\|" <<<"$hardware_matrix"; then
              echo "Physical hardware validation is not VERIFIED for $platform. Update docs/HARDWARE-VALIDATION-MATRIX.md with reproducible physical-device evidence before creating stable tags." >&2
              exit 1
            fi
          done

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_started_at=$release_started_at" >> "$GITHUB_OUTPUT"
          echo "Final release source: $source_sha (version $VERSION)."

      - name: Create immutable tags and dispatch platform builds
        id: builds
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          wait_for_run_id() {
            local workflow="$1"
            local started="$2"
            local run_id=""
            for attempt in $(seq 1 36); do
              run_id="$(gh run list --repo "$GH_REPO" --workflow "$workflow" --event workflow_dispatch --branch main --limit 30 --json databaseId,createdAt |
                jq -r --arg since "$started" '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')"
              [[ "$run_id" =~ ^[0-9]+$ ]] && { echo "$run_id"; return 0; }
              sleep 5
            done
            echo "Timed out waiting for $workflow run ID." >&2
            return 1
          }

          platforms=(windows linux macos)
          workflows=(release.yml release-linux.yml release-macos.yml)
          build_runs=()
          for index in "${!platforms[@]}"; do
            platform="${platforms[$index]}"
            workflow="${workflows[$index]}"
            tag="v${VERSION}-${platform}"
            existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" 2>/dev/null || true)"
            if [[ -n "$existing" ]]; then
              object_sha="$(jq -r '.object.sha' <<<"$existing")"
              object_type="$(jq -r '.object.type' <<<"$existing")"
              if [[ "$object_type" == "tag" ]]; then
                object_sha="$(gh api "repos/$GH_REPO/git/tags/$object_sha" --jq '.object.sha')"
              fi
              [[ "$object_sha" == "$SOURCE_SHA" ]] || {
                echo "Refusing to move immutable tag $tag: it points at $object_sha, expected $SOURCE_SHA." >&2
                exit 1
              }
            else
              gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SOURCE_SHA" >/dev/null
            fi

            # GITHUB_TOKEN-created refs do not trigger downstream push workflows.
            # Dispatch the release workflow explicitly after the immutable tag exists.
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --repo "$GH_REPO" --ref main -f "tag=$tag" -f "source_ref=$SOURCE_SHA"
            run_id="$(wait_for_run_id "$workflow" "$started")"
            build_runs+=("$platform:$run_id")
          done

          printf 'Platform build runs: %s\n' "${build_runs[*]}"
          for item in "${build_runs[@]}"; do
            run_id="${item#*:}"
            gh run watch "$run_id" --repo "$GH_REPO" --exit-status
          done

      - name: Generate and attest SPDX SBOMs for each platform release
        shell: bash
        run: |
          set -euo pipefail
          wait_for_run_id() {
            local started="$1"
            local run_id=""
            for attempt in $(seq 1 36); do
              run_id="$(gh run list --repo "$GH_REPO" --workflow sbom.yml --event workflow_dispatch --branch main --limit 30 --json databaseId,createdAt |
                jq -r --arg since "$started" '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')"
              [[ "$run_id" =~ ^[0-9]+$ ]] && { echo "$run_id"; return 0; }
              sleep 5
            done
            echo 'Timed out waiting for SBOM workflow run ID.' >&2
            return 1
          }

          sbom_runs=()
          for platform in windows linux macos; do
            tag="v${VERSION}-${platform}"
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run sbom.yml --repo "$GH_REPO" --ref main -f "tag=$tag"
            sbom_runs+=("$(wait_for_run_id "$started")")
          done
          for run_id in "${sbom_runs[@]}"; do
            gh run watch "$run_id" --repo "$GH_REPO" --exit-status
          done

      - name: Run strict final-release readiness for each platform
        shell: bash
        run: |
          set -euo pipefail
          wait_for_run_id() {
            local started="$1"
            local run_id=""
            for attempt in $(seq 1 36); do
              run_id="$(gh run list --repo "$GH_REPO" --workflow release-readiness.yml --event workflow_dispatch --branch main --limit 30 --json databaseId,createdAt |
                jq -r --arg since "$started" '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')"
              [[ "$run_id" =~ ^[0-9]+$ ]] && { echo "$run_id"; return 0; }
              sleep 5
            done
            echo 'Timed out waiting for release-readiness workflow run ID.' >&2
            return 1
          }

          readiness_runs=()
          for platform in windows linux macos; do
            tag="v${VERSION}-${platform}"
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run release-readiness.yml --repo "$GH_REPO" --ref main -f "tag=$tag"
            readiness_runs+=("$(wait_for_run_id "$started")")
          done
          for run_id in "${readiness_runs[@]}"; do
            gh run watch "$run_id" --repo "$GH_REPO" --exit-status
          done

      - name: Synchronize website release metadata and APT repository
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_STARTED_AT: ${{ steps.source.outputs.release_started_at }}
        shell: bash
        run: |
          set -euo pipefail
          wait_for_run_id() {
            local workflow="$1"
            local started="$2"
            local run_id=""
            for attempt in $(seq 1 36); do
              run_id="$(gh run list --repo "$GH_REPO" --workflow "$workflow" --event workflow_dispatch --branch main --limit 30 --json databaseId,createdAt |
                jq -r --arg since "$started" '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')"
              [[ "$run_id" =~ ^[0-9]+$ ]] && { echo "$run_id"; return 0; }
              sleep 5
            done
            echo "Timed out waiting for $workflow run ID." >&2
            return 1
          }

          sync_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run release-web-sync.yml --repo "$GH_REPO" --ref main
          sync_run_id="$(wait_for_run_id release-web-sync.yml "$sync_started")"
          gh run watch "$sync_run_id" --repo "$GH_REPO" --exit-status

          pages_run_id="$(gh run list --repo "$GH_REPO" --workflow pages.yml --event workflow_dispatch --branch main --limit 30 --json databaseId,createdAt |
            jq -r --arg since "$RELEASE_STARTED_AT" '[.[] | select(.createdAt >= $since)] | sort_by(.createdAt) | last | .databaseId // empty')"
          if [[ ! "$pages_run_id" =~ ^[0-9]+$ ]]; then
            pages_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run pages.yml --repo "$GH_REPO" --ref main
            pages_run_id="$(wait_for_run_id pages.yml "$pages_started")"
          fi
          gh run watch "$pages_run_id" --repo "$GH_REPO" --exit-status

          {
            echo "## Stable release completed"
            echo
            echo "- Source commit: $SOURCE_SHA"
            echo "- Windows: https://github.com/$GH_REPO/releases/tag/v$VERSION-windows"
            echo "- Linux: https://github.com/$GH_REPO/releases/tag/v$VERSION-linux"
            echo "- macOS: https://github.com/$GH_REPO/releases/tag/v$VERSION-macos"
            echo "- Platform package, checksum, SBOM, provenance and signing gates: passed"
            echo "- Website release metadata and signed APT publication: passed"
          } >> "$GITHUB_STEP_SUMMARY"

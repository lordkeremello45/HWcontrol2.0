name: Update latest beta release

on:
  workflow_run:
    workflows:
      - Cross-platform package validation
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA or ref to publish as the latest beta"
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: latest-beta-release
  cancel-in-progress: false

jobs:
  update-beta:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve and validate source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_REF"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --jq '.sha')"
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --jq '.sha' | grep -Fx "$source_sha" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch Windows beta release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: gh workflow run release.yml --ref main -f "tag=v0.3.0-beta-windows" -f "source_ref=$SOURCE_SHA"

      - name: Dispatch Linux beta release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: gh workflow run release-linux.yml --ref main -f "tag=v0.3.0-beta-linux" -f "source_ref=$SOURCE_SHA"

      - name: Dispatch macOS beta release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: gh workflow run release-macos.yml --ref main -f "tag=v0.3.0-beta-macos" -f "source_ref=$SOURCE_SHA"

      - name: Wait for all platform releases
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A workflows=(
            [windows]="release.yml"
            [linux]="release-linux.yml"
            [macos]="release-macos.yml"
          )
          declare -A run_ids=()

          for platform in windows linux macos; do
            workflow="${workflows[$platform]}"
            run_id=""
            for attempt in {1..36}; do
              run_id="$(gh run list --workflow "$workflow" --event workflow_dispatch --limit 20                 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" | head -n1 || true)"
              [[ -n "$run_id" ]] && break
              sleep 5
            done
            [[ -n "$run_id" ]] || { echo "No $platform release run found"; exit 1; }
            run_ids[$platform]="$run_id"
            echo "$platform run: $run_id"
          done

          deadline=$((SECONDS + 3300))
          while (( SECONDS < deadline )); do
            all_done=true
            all_success=true
            for platform in windows linux macos; do
              run_id="${run_ids[$platform]}"
              status="$(gh run view "$run_id" --json status --jq '.status')"
              conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion')"
              echo "$platform: $status / $conclusion"
              if [[ "$status" != "completed" ]]; then
                all_done=false
              elif [[ "$conclusion" != "success" ]]; then
                all_success=false
              fi
            done
            if [[ "$all_done" == true ]]; then
              [[ "$all_success" == true ]] || { echo "Platform release failed; beta tags remain unchanged."; exit 1; }
              break
            fi
            sleep 15
          done
          (( SECONDS < deadline )) || { echo "Timed out waiting for platform releases."; exit 1; }

      - name: Advance beta tags
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in windows linux macos; do
            tag="v0.3.0-beta-$platform"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"                 -f "sha=$SOURCE_SHA" -F "force=true" >/dev/null
            else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs"                 -f "ref=refs/tags/$tag" -f "sha=$SOURCE_SHA" >/dev/null
            fi
          done

      - name: Verify beta tags
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          for platform in windows linux macos; do
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.3.0-beta-$platform" --jq '.object.sha')"
            test "$actual" = "$SOURCE_SHA"
          done

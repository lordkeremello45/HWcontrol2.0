name: Update latest beta release

on:
  workflow_run:
    workflows:
      - Cross-platform package validation
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA or ref to publish as the latest beta"
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: latest-beta-release
  cancel-in-progress: false

jobs:
  update-beta:
    env:
      GH_REPO: ${{ github.repository }}
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve and validate source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_REF"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --jq '.sha')"
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --jq '.sha' | grep -Fx "$source_sha" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false

      - name: Resolve application version and release tags
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' gui_dashboard/pubspec.yaml | head -n1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid app version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch unified beta release
        id: beta
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          BETA_TAG: v${{ steps.release.outputs.version }}-beta.${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run beta-release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f "tag=$BETA_TAG" -f "source_ref=$SOURCE_SHA" -f "publish=true"
          deadline=$((SECONDS + 120))
          run_id=""
          while (( SECONDS < deadline )); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow beta-release.yml --event workflow_dispatch --branch main --limit 10 --json databaseId,createdAt,displayTitle)"
            run_id="$(jq -r --arg started "$dispatch_started_at" --arg tag "$BETA_TAG" '[.[] | select(.createdAt >= $started and .displayTitle == ("HWControl beta " + $tag))] | first | .databaseId // empty' <<< "$runs")"
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then break; fi
            sleep 5
          done
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Could not find the dispatched beta workflow run" >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "tag=$BETA_TAG" >> "$GITHUB_OUTPUT"

      - name: Wait for unified beta release
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_RUN: ${{ steps.beta.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3300))
          while (( SECONDS < deadline )); do
            status="$(gh run view "$BETA_RUN" --json status --jq '.status')"
            conclusion="$(gh run view "$BETA_RUN" --json conclusion --jq '.conclusion')"
            echo "Unified beta workflow: $status / $conclusion"
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Unified beta build or release failed." >&2; exit 1; }
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for unified beta release." >&2
          exit 1

      - name: Verify release tag, source commit and complete asset matrix
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          BETA_TAG: ${{ steps.beta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$BETA_TAG")"
          object="$(jq -r '.object.sha' <<< "$ref")"
          type="$(jq -r '.object.type' <<< "$ref")"
          if [[ "$type" == "tag" ]]; then object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq '.object.sha')"; fi
          [[ "$object" == "$SOURCE_SHA" ]] || { echo "Release tag targets $object instead of $SOURCE_SHA" >&2; exit 1; }

          assets="$(gh release view "$BETA_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          expected=(
            "HWControl-$BETA_TAG-Windows-x64-Setup.exe"
            "HWControl-$BETA_TAG-Windows-x64.msi"
            "HWControl-$BETA_TAG-Windows-x64.zip"
            "HWControl-$BETA_TAG-Windows-x64-MSIX.msix"
            "HWControl-$BETA_TAG-Windows-x64.sha256"
            "HWControl-$BETA_TAG-Linux-x64.deb"
            "HWControl-$BETA_TAG-Linux-x64.tar.gz"
            "HWControl-$BETA_TAG-Linux-x64.tar.zst"
            "HWControl-$BETA_TAG-Linux-x64.sha256"
            "HWControl-$BETA_TAG-macOS-AppleSilicon.pkg"
            "HWControl-$BETA_TAG-macOS-AppleSilicon.dmg"
            "HWControl-$BETA_TAG-macOS-AppleSilicon.sha256"
            "SHA256SUMS"
          )
          for asset in "${expected[@]}"; do
            grep -Fxq "$asset" <<< "$assets" || { echo "Missing release asset: $asset" >&2; exit 1; }
          done

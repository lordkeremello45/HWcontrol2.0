name: Update latest beta release

on:
  workflow_run:
    workflows:
      - Cross-platform package validation
    types: [completed]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit SHA or ref to publish as the latest beta"
        required: false
        default: main
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: latest-beta-release
  cancel-in-progress: false

jobs:
  update-beta:
    env:
      GH_REPO: ${{ github.repository }}
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Resolve and validate source commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$SOURCE_REF"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            source_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --jq '.sha')"
          fi
          gh api "repos/$GITHUB_REPOSITORY/commits/$source_sha" --jq '.sha' | grep -Fx "$source_sha" >/dev/null
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          persist-credentials: false

      - name: Resolve application version and release tags
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version: ([0-9]+\\.[0-9]+\\.[0-9]+)$/\\1/p' gui_dashboard/pubspec.yaml | head -n1)"
          [[ "$version" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || { echo "Invalid app version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "windows_tag=v${version}-beta.${GITHUB_RUN_NUMBER}-windows" >> "$GITHUB_OUTPUT"
          echo "linux_tag=v${version}-beta.${GITHUB_RUN_NUMBER}-linux" >> "$GITHUB_OUTPUT"
          echo "macos_tag=v${version}-beta.${GITHUB_RUN_NUMBER}-macos" >> "$GITHUB_OUTPUT"

      - name: Dispatch Windows beta release
        id: windows
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main             -f "tag=${{ steps.release.outputs.windows_tag }}"             -f "source_ref=$SOURCE_SHA" | tail -n1)"
          echo "run_id=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Dispatch Linux beta release
        id: linux
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh workflow run release-linux.yml --repo "$GITHUB_REPOSITORY" --ref main             -f "tag=${{ steps.release.outputs.linux_tag }}"             -f "source_ref=$SOURCE_SHA" | tail -n1)"
          echo "run_id=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Dispatch macOS beta release
        id: macos
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          url="$(gh workflow run release-macos.yml --repo "$GITHUB_REPOSITORY" --ref main             -f "tag=${{ steps.release.outputs.macos_tag }}"             -f "source_ref=$SOURCE_SHA" | tail -n1)"
          echo "run_id=${url##*/}" >> "$GITHUB_OUTPUT"

      - name: Wait for all platform releases
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_RUN: ${{ steps.windows.outputs.run_id }}
          LINUX_RUN: ${{ steps.linux.outputs.run_id }}
          MACOS_RUN: ${{ steps.macos.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in "$WINDOWS_RUN" "$LINUX_RUN" "$MACOS_RUN"; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "Invalid workflow run id: $run_id"; exit 1; }
          done

          deadline=$((SECONDS + 3300))
          while (( SECONDS < deadline )); do
            all_done=true
            all_success=true

            for pair in "windows:$WINDOWS_RUN" "linux:$LINUX_RUN" "macos:$MACOS_RUN"; do
              platform="${pair%%:*}"
              run_id="${pair##*:}"
              status="$(gh run view "$run_id" --json status --jq '.status')"
              conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion')"
              echo "$platform: $status / $conclusion"

              if [[ "$status" != "completed" ]]; then
                all_done=false
              elif [[ "$conclusion" != "success" ]]; then
                all_success=false
              fi
            done

            if [[ "$all_done" == true ]]; then
              [[ "$all_success" == true ]] || { echo "Platform release failed; beta tags remain unchanged."; exit 1; }
              break
            fi
            sleep 15
          done

          (( SECONDS < deadline )) || { echo "Timed out waiting for platform releases."; exit 1; }

      - name: Verify immutable platform release tags
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          WINDOWS_TAG: ${{ steps.release.outputs.windows_tag }}
          LINUX_TAG: ${{ steps.release.outputs.linux_tag }}
          MACOS_TAG: ${{ steps.release.outputs.macos_tag }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in "$WINDOWS_TAG" "$LINUX_TAG" "$MACOS_TAG"; do
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type')"
            if [[ "$type" == "tag" ]]; then
              actual="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq '.object.sha')"
            else
              actual="$object"
            fi
            test "$actual" = "$SOURCE_SHA" || { echo "Tag $tag points at $actual, expected $SOURCE_SHA" >&2; exit 1; }
          done

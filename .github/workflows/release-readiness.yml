          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir release-assets --pattern '*.msi' --pattern '*-Setup.exe' --pattern '*.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download Windows release assets.' }

      - name: Verify trusted Authenticode signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $targets = @(
            Get-ChildItem release-assets -File | Where-Object { $_.Extension -eq '.msi' -or $_.Name -like '*-Setup.exe' }
            Expand-Archive -Path (Get-ChildItem release-assets -Filter '*.zip' | Select-Object -First 1).FullName -DestinationPath expanded -Force
            Get-ChildItem expanded -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dll') }
          )
          if ($targets.Count -lt 3) { throw 'Expected signed Windows installers and executable payloads were not found.' }
          foreach ($file in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed for $($file.Name): $($signature.Status)" }
          }

  macos-publisher-trust:
    name: Verify Developer ID and notarization
    if: ${{ endsWith(inputs.tag, '-macos') }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Download macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern '*.pkg' --pattern '*.dmg' --pattern '*app-bundle.zip'

      - name: Verify Developer ID signatures and notarization tickets
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pkg="release-assets/HWControl-$TAG-macOS-AppleSilicon.pkg"
          dmg="release-assets/HWControl-$TAG-macOS-AppleSilicon.dmg"
          archive="release-assets/HWControl-$TAG-macOS-AppleSilicon-app-bundle.zip"
          pkgutil --check-signature "$pkg"
          spctl --assess --type install --verbose "$pkg"
          xcrun stapler validate "$pkg"
          xcrun stapler validate "$dmg"
          mkdir -p extracted
          ditto -x -k "$archive" extracted
          app="extracted/HWControl/HWControl.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"

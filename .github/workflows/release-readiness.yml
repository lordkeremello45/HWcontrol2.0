              entries=$((entries + 1))
            done < "$manifest"
            test "$entries" -gt 0 || { echo "Empty SHA-256 manifest: $manifest" >&2; exit 1; }
          done

      - name: Verify Linux release-manifest GPG signature
        if: ${{ endsWith(inputs.tag, '-linux') }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/hwcontrol-release-verify"
          install -d -m 0700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import release-assets/HWControl-GPG-public.asc
          expected="$(grep -Eo '[A-F0-9]{40}' release-assets/HWControl-GPG-fingerprint.txt | head -n1)"
          actual="$(gpg --batch --with-colons --fingerprint | awk -F: '$1 == "fpr" {print $10; exit}')"
          [[ -n "$expected" && "$actual" == "$expected" ]] || { echo "Linux release signer fingerprint mismatch." >&2; exit 1; }
          gpg --batch --verify \
            "release-assets/HWControl-$TAG-Linux-x64.sha256.asc" \
            "release-assets/HWControl-$TAG-Linux-x64.sha256"

      - name: Verify GitHub artifact attestations
        shell: bash
        run: |
          set -euo pipefail
          case "$TAG" in
            *-windows) assets=("HWControl-$TAG-Windows-x64-Setup.exe" "HWControl-$TAG-Windows-x64.msi" "HWControl-$TAG-Windows-x64.zip") ;;
            *-linux) assets=("HWControl-$TAG-Linux-x64.deb" "HWControl-$TAG-Linux-x64.tar.gz" "HWControl-$TAG-Linux-x64.tar.zst" "HWControl-$TAG-Linux-x64.zip") ;;
            *-macos) assets=("HWControl-$TAG-macOS-AppleSilicon.pkg" "HWControl-$TAG-macOS-AppleSilicon.dmg" "HWControl-$TAG-macOS-AppleSilicon-app-bundle.zip") ;;
          esac
          for asset in "${assets[@]}"; do
            gh attestation verify "release-assets/$asset" --repo "$GITHUB_REPOSITORY"
          done

      - name: Summarize verified release integrity
        run: |
          {
            echo "## Final release integrity"
            echo
            echo "- Release: `$TAG`"
            echo "- Required platform assets: present"
            echo "- SHA-256 manifests: verified"
            echo "- GitHub artifact attestations: verified"
            if [[ "$TAG" == *-linux ]]; then echo "- Linux release GPG signature and pinned fingerprint: verified"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  windows-publisher-trust:

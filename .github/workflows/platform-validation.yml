name: Cross-platform package validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  linux:
    name: Linux build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Build and test native engine
        run: |
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Test local security tooling
        run: GO111MODULE=off go test -count=1 ./security/local-audit
      - name: Test and build bridge
        working-directory: bridge_service
        run: |
          go vet ./...
          go test -count=1 ./...
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service ./src
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../security-guardian ./security_guardian
      - name: Prepare and validate dashboard
        working-directory: gui_dashboard
        run: |
          flutter create --platforms=linux --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub
          flutter build linux --release -t lib/installer_main.dart

  windows:
    name: Windows build and test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          architecture: X64
      - name: Build and test native engine
        shell: pwsh
        run: |
          cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build-windows --config Release --parallel 2
          ctest --test-dir build-windows -C Release --output-on-failure
      - name: Test and build bridge
        working-directory: bridge_service
        shell: pwsh
        run: |
          go vet ./...
          go test -count=1 ./...
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service.exe ./src
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../security-guardian.exe ./security_guardian
      - name: Prepare and validate dashboard
        working-directory: gui_dashboard
        shell: pwsh
        run: |
          flutter create --platforms=windows --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub
          flutter build windows --release -t lib/installer_main.dart

  macos:
    name: macOS build and test
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          architecture: ARM64
      - name: Build and test native engine
        run: |
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Test and build bridge
        working-directory: bridge_service
        run: |
          go vet ./...
          go test -count=1 ./...
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service ./src
      - name: Prepare and validate dashboard
        working-directory: gui_dashboard
        run: |
          flutter create --platforms=macos --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub
          flutter build macos --release -t lib/installer_main.dart

  tooling:
    name: Rust and Python tooling validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test Rust telemetry analyzer
        run: |
          cargo test --manifest-path tools/telemetry-analyzer/Cargo.toml
          cargo run --manifest-path tools/telemetry-analyzer/Cargo.toml -- tools/telemetry-analyzer/fixtures/healthy.csv
      - name: Test Python telemetry fixture tooling
        run: |
          python3 --version
          python3 -m unittest discover -s tools/telemetry -p 'test_*.py'


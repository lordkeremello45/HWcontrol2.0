name: Cross-platform package validation

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build and test Linux
        run: |
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          (cd bridge_service && go test ./... && go build -trimpath -ldflags='-s -w' -o ../bridge-service ./src)
          (cd gui_dashboard && flutter create --platforms=linux --no-pub . && git restore pubspec.yaml test/widget_test.dart && flutter pub get && flutter analyze && flutter test && flutter build linux --release -t lib/installer_main.dart)

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build and test Windows
        shell: pwsh
        run: |
          cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build-windows --config Release --parallel 2
          Push-Location bridge_service
          go test ./...
          go build -trimpath -ldflags='-s -w' -o ../bridge-service.exe ./src
          Pop-Location
          Push-Location gui_dashboard
          flutter create --platforms=windows --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --release -t lib/installer_main.dart
          Pop-Location
      - name: Build MSI and validate installed runtime
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2 --add-source https://api.nuget.org/v3/index.json
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          $packageDir = "$PWD/package/HWControl-test-Windows-x64"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item build-windows/ai_core/Release/ai_engine.exe "$packageDir/ai_engine.exe"
          Copy-Item bridge-service.exe "$packageDir/bridge-service.exe"
          Copy-Item -Recurse gui_dashboard/build/windows/x64/runner/Release "$packageDir/dashboard"
          Copy-Item gui_dashboard/build/windows/x64/runner/Release/hwcontrol_dashboard.exe "$packageDir/HWControl.exe"
          Copy-Item deploy/windows/install-bridge-service.ps1,deploy/windows/remove-hwcontrol.ps1 "$packageDir"
          if (-not (Test-Path "$packageDir/HWControl.exe")) { throw 'Windows executable was not produced' }
          wix build deploy/windows/HWControl.wxs -arch x64 -d Version=0.0.0 -d PackageDir=$packageDir -o HWControl-test.msi
          if (-not (Test-Path "$PWD/HWControl-test.msi")) { throw 'MSI was not produced' }
          $install = Start-Process msiexec.exe -ArgumentList '/i', "$PWD/HWControl-test.msi", '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "MSI install failed with exit code $($install.ExitCode)" }
          $bridgeExe = "$env:ProgramFiles\HWControl\bridge-service.exe"
          if (-not (Test-Path $bridgeExe)) { throw 'MSI did not install bridge-service.exe into Program Files' }
          if (-not (Test-Path "$env:ProgramFiles\HWControl\dashboard")) { throw 'MSI did not install dashboard' }
          if (-not (Test-Path "$env:ProgramFiles\HWControl\HWControl.exe")) { throw 'MSI did not install HWControl.exe' }
          $service = Get-Service -Name HWControlBridge -ErrorAction Stop
          if ($service.Status -ne 'Running') { throw "HWControlBridge service is not running: $($service.Status)" }
          $envKey = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' -Name HWCONTROL_KEY -ErrorAction Stop).HWCONTROL_KEY
          if ([string]::IsNullOrWhiteSpace($envKey) -or $envKey -eq 'replace-me') { throw 'HWCONTROL_KEY was not provisioned by the installed bridge' }
          $probe = Test-NetConnection 127.0.0.1 -Port 8080 -WarningAction SilentlyContinue
          if (-not $probe.TcpTestSucceeded) { throw 'Installed HWControlBridge is not listening on 127.0.0.1:8080' }
          $uninstall = Start-Process msiexec.exe -ArgumentList '/x', "$PWD/HWControl-test.msi", '/qn', '/norestart' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "MSI uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Get-Service -Name HWControlBridge -ErrorAction SilentlyContinue) { throw 'HWControlBridge service still exists after uninstall' }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Build and test macOS
        run: |
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          (cd bridge_service && go test ./... && go build -trimpath -ldflags='-s -w' -o ../bridge-service ./src)
          (cd gui_dashboard && flutter create --platforms=macos --no-pub . && git restore pubspec.yaml test/widget_test.dart && flutter pub get && flutter analyze && flutter test && flutter build macos --release -t lib/installer_main.dart)

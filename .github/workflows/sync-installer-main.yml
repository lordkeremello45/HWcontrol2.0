name: Sync latest installers into main

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to sync, e.g. v0.2.1-windows'
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: macos-14
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p installer/.incoming
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.msi' --pattern '*.pkg' --pattern '*.deb' --pattern '*.dmg' --dir installer/.incoming

      - name: Extract macOS application bundle
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          dmg="$(find installer/.incoming -maxdepth 1 -type f -name '*.dmg' | head -n 1 || true)"
          rm -rf installer/macos/HWControl.app
          mkdir -p installer/macos
          if [ -n "$dmg" ]; then
            mountpoint="$(mktemp -d /tmp/hwcontrol-dmg.XXXXXX)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null
            app="$(find "$mountpoint" -maxdepth 2 -type d -name 'HWControl.app' | head -n 1 || true)"
            if [ -n "$app" ]; then
              ditto "$app" installer/macos/HWControl.app
            else
              echo 'HWControl.app was not found in the DMG.' >&2
              hdiutil detach "$mountpoint" >/dev/null || true
              exit 1
            fi
            hdiutil detach "$mountpoint" >/dev/null
          fi

      - name: Replace previous installer binaries
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf installer/releases
          mkdir -p installer/releases
          find installer/.incoming -maxdepth 1 -type f \( -name '*.msi' -o -name '*.pkg' -o -name '*.deb' -o -name '*.sha256' \) -exec cp {} installer/releases/ \;
          printf '%s\n' "$TAG" > installer/releases/VERSION
          rm -rf installer/.incoming

      - name: Commit installer snapshot to main
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer
          if git diff --cached --quiet; then
            echo 'Installer snapshot is already current.'
            exit 0
          fi
          git commit -m "chore(installer): sync $TAG release assets [skip ci]"
          git push origin main

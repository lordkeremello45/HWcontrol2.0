name: Sync latest installers into main

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Refresh the latest Windows, macOS and Linux installers'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  sync:
    runs-on: macos-14
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve latest stable platform releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate repos/$GITHUB_REPOSITORY/releases --jq '.[] | select(.draft == false and .prerelease == false) | [.tag_name,.published_at] | @tsv')"
          latest_for() {
            printf '%s\n' "$releases" | awk -F '\t' -v suffix="$1" '$1 ~ suffix "$"' | sort -t $'\t' -k2,2r | head -n1 | cut -f1
          }
          windows="$(latest_for '-windows')"
          macos="$(latest_for '-macos')"
          linux="$(latest_for '-linux')"
          [ -n "$windows" ] && [ -n "$macos" ] && [ -n "$linux" ] || { echo 'Could not resolve all three stable platform releases.' >&2; exit 1; }
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          printf 'Windows: %s\nmacOS: %s\nLinux: %s\n' "$windows" "$macos" "$linux"

      - name: Download latest Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.releases.outputs.windows }}
        run: |
          set -euo pipefail
          mkdir -p installer/.incoming/windows
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.msi' --pattern '*.sha256' --dir installer/.incoming/windows
          test -n "$(find installer/.incoming/windows -maxdepth 1 -type f -name '*.msi' -print -quit)"
          test -n "$(find installer/.incoming/windows -maxdepth 1 -type f -name '*.sha256' -print -quit)"

      - name: Download latest macOS installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.releases.outputs.macos }}
        run: |
          set -euo pipefail
          mkdir -p installer/.incoming/macos
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.pkg' --pattern '*.dmg' --pattern '*.sha256' --dir installer/.incoming/macos
          test -n "$(find installer/.incoming/macos -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$(find installer/.incoming/macos -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$(find installer/.incoming/macos -maxdepth 1 -type f -name '*.sha256' -print -quit)"

      - name: Download latest Linux installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.releases.outputs.linux }}
        run: |
          set -euo pipefail
          mkdir -p installer/.incoming/linux
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --pattern '*.rpm' --pattern '*.pkg.tar.zst' --pattern '*.tar.zst' --pattern '*.tar.gz' --pattern '*.sha256' --dir installer/.incoming/linux
          test -n "$(find installer/.incoming/linux -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find installer/.incoming/linux -maxdepth 1 -type f -name '*.sha256' -print -quit)"

      - name: Extract macOS application bundle
        run: |
          set -euo pipefail
          dmg="$(find installer/.incoming/macos -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          rm -rf installer/macos/HWControl.app
          mkdir -p installer/macos
          mountpoint="$(mktemp -d /tmp/hwcontrol-dmg.XXXXXX)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null
          cleanup() { hdiutil detach "$mountpoint" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          app="$(find "$mountpoint" -maxdepth 2 -type d -name 'HWControl.app' | head -n 1 || true)"
          if [ -z "$app" ]; then
            echo 'HWControl.app was not found in the latest macOS DMG.' >&2
            exit 1
          fi
          ditto "$app" installer/macos/HWControl.app

      - name: Replace installer snapshot
        env:
          WINDOWS_TAG: ${{ steps.releases.outputs.windows }}
          MACOS_TAG: ${{ steps.releases.outputs.macos }}
          LINUX_TAG: ${{ steps.releases.outputs.linux }}
        run: |
          set -euo pipefail
          rm -rf installer/releases
          mkdir -p installer/releases/windows installer/releases/macos installer/releases/linux
          cp installer/.incoming/windows/*.msi installer/releases/windows/
          cp installer/.incoming/windows/*.sha256 installer/releases/windows/
          cp installer/.incoming/macos/*.pkg installer/releases/macos/
          cp installer/.incoming/macos/*.dmg installer/releases/macos/
          cp installer/.incoming/macos/*.sha256 installer/releases/macos/
          cp installer/.incoming/linux/* installer/releases/linux/
          printf 'Windows=%s\nmacOS=%s\nLinux=%s\n' "$WINDOWS_TAG" "$MACOS_TAG" "$LINUX_TAG" > installer/releases/VERSIONS
          rm -rf installer/.incoming

      - name: Commit installer snapshot to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add installer
          if git diff --cached --quiet; then
            echo 'Installer snapshot is already current.'
            exit 0
          fi
          git commit -m "chore(installer): sync latest platform releases [skip ci]"
          git push origin main

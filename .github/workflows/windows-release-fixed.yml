name: Publish platform release

on:
  push:
    tags:
      - 'v*-windows'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
          architecture: X64

      - name: Prepare Windows Flutter project
        working-directory: gui_dashboard
        shell: pwsh
        run: |
          flutter create --platforms=windows --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get

      - name: Build and test Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build-windows --config Release --parallel 2
          ctest --test-dir build-windows -C Release --output-on-failure

          Push-Location bridge_service
          go test -count=1 ./...
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service.exe ./src
          Pop-Location

          Push-Location gui_dashboard
          flutter analyze
          flutter test --no-pub
          flutter build windows --release -t lib/installer_main.dart
          Pop-Location

      - name: Assemble Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = "package/HWControl-${{ github.ref_name }}-Windows-x64"
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item build-windows/ai_core/Release/ai_engine.exe "$packageDir/ai_engine.exe"
          Copy-Item -Recurse gui_dashboard/build/windows/x64/runner/Release "$packageDir/dashboard"
          Copy-Item gui_dashboard/build/windows/x64/runner/Release/hwcontrol_dashboard.exe "$packageDir/HWControl.exe"
          Copy-Item bridge-service.exe "$packageDir/bridge-service.exe"
          Copy-Item README.md, SECURITY.md, THIRD_PARTY_NOTICES $packageDir
          Copy-Item -Recurse deploy/windows "$packageDir/deploy"

          foreach ($required in @('HWControl.exe','bridge-service.exe','ai_engine.exe')) {
            if (-not (Test-Path "$packageDir/$required")) { throw "$required missing from Windows package" }
          }

      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 6.0.2 --add-source https://api.nuget.org/v3/index.json
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          $version = "${{ github.ref_name }}" -replace '^v', '' -replace '-windows$', ''
          $packageDir = "package/HWControl-${{ github.ref_name }}-Windows-x64"
          wix build deploy/windows/HWControl.wxs -arch x64 -d Version=$version -d PackageDir=$packageDir -o "HWControl-${{ github.ref_name }}-Windows-x64.msi"
          if (-not (Test-Path "HWControl-${{ github.ref_name }}-Windows-x64.msi")) { throw 'MSI was not produced' }
          if ((Get-Item "HWControl-${{ github.ref_name }}-Windows-x64.msi").Length -lt 4096) { throw 'MSI is unexpectedly small' }

      - name: Smoke test MSI install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "HWControl-${{ github.ref_name }}-Windows-x64.msi").Path
          $root = Join-Path $env:RUNNER_TEMP 'HWControl-MSI-Validation'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $log = Join-Path $root 'install.log'
          $install = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList @('/i',$msi,'/qn','/norestart','/L*V',$log) -Wait -PassThru
          if ($install.ExitCode -ne 0) { Get-Content $log -Tail 250; throw "MSI install failed: $($install.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\HWControl\HWControl.exe")) { throw 'HWControl.exe was not installed' }
          if (-not (Test-Path "$env:ProgramFiles\HWControl\bridge-service.exe")) { throw 'bridge-service.exe was not installed' }
          $service = Get-Service -Name HWControlBridge -ErrorAction Stop
          if ($service.Status -ne 'Running') { throw "HWControlBridge is not running: $($service.Status)" }
          $probe = Test-NetConnection 127.0.0.1 -Port 8080 -WarningAction SilentlyContinue
          if (-not $probe.TcpTestSucceeded) { throw 'Bridge is not listening on 127.0.0.1:8080' }
          $uninstall = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" -ArgumentList @('/x',$msi,'/qn','/norestart','/L*V',(Join-Path $root 'uninstall.log')) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { Get-Content (Join-Path $root 'uninstall.log') -Tail 250; throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          if (Get-Service -Name HWControlBridge -ErrorAction SilentlyContinue) { throw 'HWControlBridge still exists after MSI uninstall' }
          if (Test-Path "$env:ProgramFiles\HWControl") { throw 'Program Files\HWControl still exists after MSI uninstall' }
          if (Test-Path "$env:ProgramData\HWControl\bridge.key") { throw 'bridge.key still exists after MSI uninstall' }
          $leftover = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Environment' -Name HWCONTROL_KEY -ErrorAction SilentlyContinue
          if ($null -ne $leftover) { throw 'HWCONTROL_KEY still exists after MSI uninstall' }

      - name: Package ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = "package/HWControl-${{ github.ref_name }}-Windows-x64"
          Compress-Archive -Path "$packageDir/*" -DestinationPath "HWControl-${{ github.ref_name }}-Windows-x64.zip"
          Expand-Archive -Path "HWControl-${{ github.ref_name }}-Windows-x64.zip" -DestinationPath verify-zip -Force
          if (-not (Test-Path "verify-zip/$packageDir/HWControl.exe")) { throw 'HWControl.exe missing from ZIP' }
          if (-not (Test-Path "verify-zip/$packageDir/bridge-service.exe")) { throw 'bridge-service.exe missing from ZIP' }

      - name: Generate checksums
        shell: pwsh
        run: |
          $zip = "HWControl-${{ github.ref_name }}-Windows-x64.zip"
          $msi = "HWControl-${{ github.ref_name }}-Windows-x64.msi"
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $msiHash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "HWControl-${{ github.ref_name }}-Windows-x64.sha256" @(
            "$zipHash  $zip",
            "$msiHash  $msi"
          )
          if ((Get-Content "HWControl-${{ github.ref_name }}-Windows-x64.sha256").Count -ne 2) { throw 'Invalid checksum manifest' }

      - name: Generate package provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            HWControl-${{ github.ref_name }}-Windows-x64.zip
            HWControl-${{ github.ref_name }}-Windows-x64.msi

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-Windows-x64
          path: |
            HWControl-${{ github.ref_name }}-Windows-x64.zip
            HWControl-${{ github.ref_name }}-Windows-x64.msi
            HWControl-${{ github.ref_name }}-Windows-x64.sha256

  release:
    needs: build-windows
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: HWControl-${{ github.ref_name }}-Windows-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HWControl ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.msi
            dist/*.sha256

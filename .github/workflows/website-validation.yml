name: Validate website release integration

on:
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/generate-release-manifest.py'
      - 'scripts/website-release-test.mjs'
      - '.github/workflows/release-web-sync.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/website-validation.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/generate-release-manifest.py'
      - 'scripts/website-release-test.mjs'
      - '.github/workflows/release-web-sync.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/website-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject legacy source HTML
        run: |
          set -euo pipefail
          if find website -type f -name '*.html' -not -path 'website/dist/*' -not -path 'website/node_modules/*' -print -quit | grep -q .; then
            echo 'Legacy source HTML found under website/. All website pages must be Astro source.'
            exit 1
          fi

      - name: Validate JavaScript
        run: node --check website/public/app.js

      - name: Validate Python manifest generator
        run: python3 -m py_compile scripts/generate-release-manifest.py

      - name: Validate release manifest when present
        run: |
          set -euo pipefail
          if [ -f website/public/release.json ]; then
            node scripts/website-release-test.mjs website/public/release.json
          else
            echo 'release.json is not present in this revision; generator will create it after release publication.'
          fi

      - name: Validate required website integration
        run: |
          set -euo pipefail
          grep -Fq 'const manifestUrl="./release.json";' website/public/app.js
          grep -Fq 'checksum_sha256_url' website/public/app.js
          grep -Fq 'state.manifest' website/public/app.js
          grep -Fq 'release-web-sync' .github/workflows/release-web-sync.yml
          echo 'Website release integration: OK'

name: Local IPC smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ipc-smoke
  cancel-in-progress: true

jobs:
  linux:
    name: Linux Unix socket smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Build bridge
        working-directory: bridge_service
        run: go build -buildvcs=false -trimpath -o ../bridge-service ./src
      - name: Start bridge and exercise authenticated Unix socket
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          key_file="$tmp/bridge.key"
          socket="$tmp/bridge.sock"
          python3 - "$key_file" <<'PY'
          import secrets, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(secrets.token_hex(32) + "\n")
          PY
          chmod 600 "$key_file"
          HWCONTROL_KEY_FILE="$key_file" HWCONTROL_SOCKET="$socket" ./bridge-service >"$tmp/bridge.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          for _ in $(seq 1 50); do test -S "$socket" && break; sleep .1; done
          test -S "$socket"
          python3 - "$socket" "$key_file" <<'PY'
          import hashlib, hmac, json, secrets, socket, sys, time
          sock_path, key_path = sys.argv[1:]
          key = open(key_path).read().strip()
          action = "Get Status"
          value = 0.0
          timestamp = int(time.time() * 1000)
          nonce = secrets.token_hex(16)
          payload = f"{action}\n{value:.6f}\n{timestamp}\n{nonce}"
          auth = hmac.new(key.encode(), payload.encode(), hashlib.sha256).hexdigest()
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(5)
              s.connect(sock_path)
              s.sendall((json.dumps({"action": action, "value": value, "timestamp": timestamp, "nonce": nonce, "auth": auth}) + "\n").encode())
              response = json.loads(s.makefile("r").readline())
          assert response["status"] == "SUCCESS", response
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(5)
              s.connect(sock_path)
              s.sendall((json.dumps({"action": action, "value": value, "timestamp": timestamp, "nonce": nonce, "auth": auth}) + "\n").encode())
              replay = json.loads(s.makefile("r").readline())
          assert replay["status"] == "ERROR" and "replayed" in replay["message"], replay

          stale_timestamp = timestamp - 60000
          stale_nonce = secrets.token_hex(16)
          stale_payload = f"{action}\n{value:.6f}\n{stale_timestamp}\n{stale_nonce}"
          stale_auth = hmac.new(key.encode(), stale_payload.encode(), hashlib.sha256).hexdigest()
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(5)
              s.connect(sock_path)
              s.sendall((json.dumps({"action": action, "value": value, "timestamp": stale_timestamp, "nonce": stale_nonce, "auth": stale_auth}) + "\n").encode())
              stale = json.loads(s.makefile("r").readline())
          assert stale["status"] == "ERROR" and "timestamp" in stale["message"], stale
          PY

  macos:
    name: macOS Unix socket smoke
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Build bridge
        working-directory: bridge_service
        run: go build -buildvcs=false -trimpath -o ../bridge-service ./src
      - name: Start bridge and exercise authenticated Unix socket
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          key_file="$tmp/bridge.key"
          socket="$tmp/bridge.sock"
          python3 - "$key_file" <<'PY'
          import secrets, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(secrets.token_hex(32) + "\n")
          PY
          chmod 600 "$key_file"
          HWCONTROL_KEY_FILE="$key_file" HWCONTROL_SOCKET="$socket" ./bridge-service >"$tmp/bridge.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; rm -rf "$tmp"' EXIT
          for _ in $(seq 1 50); do test -S "$socket" && break; sleep .1; done
          test -S "$socket"
          python3 - "$socket" "$key_file" <<'PY'
          import hashlib, hmac, json, secrets, socket, sys, time
          sock_path, key_path = sys.argv[1:]
          key = open(key_path).read().strip()
          action = "Get Status"
          value = 0.0
          timestamp = int(time.time() * 1000)
          nonce = secrets.token_hex(16)
          payload = f"{action}\n{value:.6f}\n{timestamp}\n{nonce}"
          auth = hmac.new(key.encode(), payload.encode(), hashlib.sha256).hexdigest()
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(5)
              s.connect(sock_path)
              s.sendall((json.dumps({"action": action, "value": value, "timestamp": timestamp, "nonce": nonce, "auth": auth}) + "\n").encode())
              response = json.loads(s.makefile("r").readline())
          assert response["status"] == "SUCCESS", response
          PY

  windows:
    name: Windows loopback compatibility smoke
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Build bridge
        shell: pwsh
        working-directory: bridge_service
        run: go build -buildvcs=false -trimpath -o ../bridge-service.exe ./src
      - name: Start bridge and exercise authenticated TCP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          $env:HWCONTROL_KEY = $key
          $env:HWCONTROL_PORT = '18080'
          $process = Start-Process -FilePath "$PWD\bridge-service.exe" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\bridge.out" -RedirectStandardError "$env:RUNNER_TEMP\bridge.err"
          try {
            $ready = $false
            for ($i = 0; $i -lt 50; $i++) {
              Start-Sleep -Milliseconds 100
              if ((Test-NetConnection 127.0.0.1 -Port 18080 -WarningAction SilentlyContinue).TcpTestSucceeded) { $ready = $true; break }
            }
            if (-not $ready) { throw 'Bridge did not start on compatibility TCP endpoint.' }
            $action = 'Get Status'
            $value = 0.0
            $timestamp = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            $nonceBytes = New-Object byte[] 16
            [System.Security.Cryptography.RandomNumberGenerator]::Fill($nonceBytes)
            $nonce = [Convert]::ToHexString($nonceBytes).ToLowerInvariant()
            $payload = "$action`n{0:F6}`n$timestamp`n$nonce" -f $value
            $hmac = [System.Security.Cryptography.HMACSHA256]::new([Text.Encoding]::UTF8.GetBytes($key))
            $auth = [Convert]::ToHexString($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload))).ToLowerInvariant()
            $client = [Net.Sockets.TcpClient]::new('127.0.0.1', 18080)
            $stream = $client.GetStream()
            $request = [Text.Encoding]::UTF8.GetBytes((ConvertTo-Json @{ action=$action; value=$value; timestamp=$timestamp; nonce=$nonce; auth=$auth; } -Compress) + "`n")
            $stream.Write($request, 0, $request.Length)
            $reader = [IO.StreamReader]::new($stream)
            $response = $reader.ReadLine() | ConvertFrom-Json
            if ($response.status -ne 'SUCCESS') { throw "Bridge response: $($response.message)" }

            $replayClient = [Net.Sockets.TcpClient]::new('127.0.0.1', 18080)
            $replayStream = $replayClient.GetStream()
            $replayRequest = [Text.Encoding]::UTF8.GetBytes((ConvertTo-Json @{ action=$action; value=$value; timestamp=$timestamp; nonce=$nonce; auth=$auth; } -Compress) + "`n")
            $replayStream.Write($replayRequest, 0, $replayRequest.Length)
            $replayResponse = [IO.StreamReader]::new($replayStream).ReadLine() | ConvertFrom-Json
            if ($replayResponse.status -ne 'ERROR' -or $replayResponse.message -notlike '*replayed*') { throw "Replay was not rejected: $($replayResponse.message)" }
            $replayClient.Dispose()

            $staleTimestamp = $timestamp - 60000
            $staleBytes = New-Object byte[] 16
            [System.Security.Cryptography.RandomNumberGenerator]::Fill($staleBytes)
            $staleNonce = [Convert]::ToHexString($staleBytes).ToLowerInvariant()
            $stalePayload = "$action`n{0:F6}`n$staleTimestamp`n$staleNonce" -f $value
            $staleAuth = [Convert]::ToHexString($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes($stalePayload))).ToLowerInvariant()
            $staleClient = [Net.Sockets.TcpClient]::new('127.0.0.1', 18080)
            $staleStream = $staleClient.GetStream()
            $staleRequest = [Text.Encoding]::UTF8.GetBytes((ConvertTo-Json @{ action=$action; value=$value; timestamp=$staleTimestamp; nonce=$staleNonce; auth=$staleAuth; } -Compress) + "`n")
            $staleStream.Write($staleRequest, 0, $staleRequest.Length)
            $staleResponse = [IO.StreamReader]::new($staleStream).ReadLine() | ConvertFrom-Json
            if ($staleResponse.status -ne 'ERROR' -or $staleResponse.message -notlike '*timestamp*') { throw "Stale timestamp was not rejected: $($staleResponse.message)" }
            $staleClient.Dispose()
            $client.Dispose()
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

name: Beta Application Release

on:
  push:
    tags:
      - 'v*-beta.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta release tag (for example v2.1.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  windows:
    name: Windows x64 beta
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: X64
          cache: true

      - name: Build native engine
        shell: pwsh
        run: |
          cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build-windows --config Release --parallel 2
          ctest --test-dir build-windows -C Release --output-on-failure

      - name: Build bridge
        working-directory: bridge_service
        shell: pwsh
        run: |
          go vet ./...
          go test -count=1 ./...
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service.exe ./src

      - name: Build Flutter application
        working-directory: gui_dashboard
        shell: pwsh
        run: |
          flutter create --platforms=windows --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub
          flutter build windows --release -t lib/installer_main.dart

      - name: Assemble Windows portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/windows/HWControl
          Copy-Item -Recurse gui_dashboard/build/windows/x64/runner/Release/* release/windows/HWControl/
          Copy-Item bridge-service.exe release/windows/HWControl/
          if (Test-Path build-windows/Release) {
            Copy-Item -Recurse build-windows/Release/* release/windows/HWControl/ -ErrorAction SilentlyContinue
          }
          Set-Content release/windows/HWControl/README.txt "HWControl 2.0 beta - Windows x64 portable bundle"
          Compress-Archive -Path release/windows/HWControl -DestinationPath release/HWControl-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HWControl-windows-x64
          path: release/HWControl-windows-x64.zip

  linux:
    name: Linux x64 beta
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build native engine
        run: |
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Build bridge
        working-directory: bridge_service
        run: |
          go vet ./...
          go test -count=1 ./...
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service ./src

      - name: Build Flutter application
        working-directory: gui_dashboard
        run: |
          flutter create --platforms=linux --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub
          flutter build linux --release -t lib/installer_main.dart

      - name: Assemble Linux portable bundle
        run: |
          mkdir -p release/linux/HWControl
          cp -a gui_dashboard/build/linux/x64/release/bundle/. release/linux/HWControl/
          cp bridge-service release/linux/HWControl/
          if [ -d build ]; then cp -a build/. release/linux/HWControl/native-build/ 2>/dev/null || true; fi
          printf '%s\n' 'HWControl 2.0 beta - Linux x64 portable bundle' > release/linux/HWControl/README.txt
          tar -C release/linux -czf release/HWControl-linux-x64.tar.gz HWControl

      - uses: actions/upload-artifact@v4
        with:
          name: HWControl-linux-x64
          path: release/HWControl-linux-x64.tar.gz

  macos:
    name: macOS Apple Silicon beta
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ARM64
          cache: true

      - name: Build native engine
        run: |
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure

      - name: Build bridge
        working-directory: bridge_service
        run: |
          go vet ./...
          go test -count=1 ./...
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service ./src

      - name: Build Flutter application
        working-directory: gui_dashboard
        run: |
          flutter create --platforms=macos --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub
          flutter build macos --release -t lib/installer_main.dart

      - name: Assemble macOS portable bundle
        run: |
          mkdir -p release/macos/HWControl
          cp -R gui_dashboard/build/macos/Build/Products/Release/*.app release/macos/HWControl/
          cp bridge-service release/macos/HWControl/
          printf '%s\n' 'HWControl 2.0 beta - macOS Apple Silicon bundle' > release/macos/HWControl/README.txt
          hdiutil create -volname HWControl -srcfolder release/macos/HWControl -ov -format UDZO release/HWControl-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: HWControl-macos-arm64
          path: release/HWControl-macos-arm64.dmg

  release:
    name: Publish GitHub beta release
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate checksums
        shell: bash
        run: |
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: HWControl 2.0 ${{ steps.tag.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.tar.gz
            release-assets/**/*.dmg
            release-assets/SHA256SUMS

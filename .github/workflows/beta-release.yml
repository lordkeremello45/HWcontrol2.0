name: Beta Application Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta release tag, for example v0.3.1-beta.1'
        default: 'v0.3.1-beta.1'
        required: true
        type: string
      source_ref:
        description: 'Source branch or full commit SHA to build'
        default: 'main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.2
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  prepare-release:
    name: Validate source and immutable beta tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Validate release tag and source version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+-beta\\.[0-9]+$ ]]; then
            echo "Invalid unified beta release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          app_version="$(sed -nE 's/^version: ([0-9]+\\.[0-9]+\\.[0-9]+)$/\\1/p' gui_dashboard/pubspec.yaml | head -n1)"
          tag_version="${RELEASE_TAG#v}"
          tag_version="${tag_version%%-*}"
          [[ -n "$app_version" && "$app_version" == "$tag_version" ]] || { echo "Tag version $tag_version does not match source app version $app_version" >&2; exit 1; }
          source_sha="$(git rev-parse HEAD)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json" 2>/dev/null; then
            object="$(jq -r '.object.sha' "$RUNNER_TEMP/tag-ref.json")"
            type="$(jq -r '.object.type' "$RUNNER_TEMP/tag-ref.json")"
            if [[ "$type" == "tag" ]]; then object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq '.object.sha')"; fi
            [[ "$object" == "$source_sha" ]] || { echo "Existing tag points at $object, expected $source_sha; refusing to move it" >&2; exit 1; }
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "Invalid beta release tag format: $RELEASE_TAG" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: X64
          cache: true
      - name: Build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build-windows --config Release --parallel 2
          ctest --test-dir build-windows -C Release --output-on-failure
          Push-Location bridge_service
          go vet ./...
          go test -count=1 ./...
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service.exe ./src
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../security-guardian.exe ./security_guardian
          Pop-Location
          Push-Location gui_dashboard
          flutter create --platforms=windows --no-pub .
          git restore pubspec.yaml test/widget_test.dart
          flutter pub get
          flutter analyze
          flutter test --no-pub
          flutter build windows --release -t lib/installer_main.dart --dart-define=HWCONTROL_RELEASE_TRUST=official
          Pop-Location
      - name: Assemble Windows payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "HWControl-$env:RELEASE_TAG-Windows-x64"
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "package/$root" | Out-Null
          $helperStage = "package/$root/.hardware-helper-stage"
          dotnet publish lib/hardware-identification/HWControl.HardwareIdentification.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output $helperStage
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the C# hardware identification helper failed' }
          $helper = Join-Path $helperStage 'hwcontrol-hardware-identification.exe'
          if (-not (Test-Path $helper)) { throw 'Published C# hardware identification helper is missing' }
          Copy-Item $helper "package/$root/hwcontrol-hardware-identification.exe"
          Remove-Item $helperStage -Recurse -Force
          & "package/$root/hwcontrol-hardware-identification.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged C# hardware identification self-test failed' }
          Copy-Item build-windows/ai_core/Release/ai_engine.exe "package/$root/ai_engine.exe"
          Copy-Item build-windows/audio_core/Release/hwcontrol_audio_probe.exe "package/$root/hwcontrol_audio_probe.exe"
          Copy-Item -Recurse gui_dashboard/build/windows/x64/runner/Release "package/$root/dashboard"
          Copy-Item gui_dashboard/build/windows/x64/runner/Release/hwcontrol_dashboard.exe "package/$root/HWControl.exe"
          Copy-Item bridge-service.exe "package/$root/bridge-service.exe"
          Copy-Item security-guardian.exe "package/$root/security-guardian.exe"
          New-Item -ItemType Directory -Force -Path "package/$root/security/fetch-status" | Out-Null
          Copy-Item security/fetch-status/bridger.key "package/$root/security/fetch-status/bridger.key"
          Copy-Item README.md, SECURITY.md, THIRD_PARTY_NOTICES "package/$root/"
          Copy-Item -Recurse deploy/windows "package/$root/deploy"
          foreach ($required in @('HWControl.exe','bridge-service.exe','security-guardian.exe','hwcontrol-hardware-identification.exe','ai_engine.exe','hwcontrol_audio_probe.exe','security/fetch-status/bridger.key')) {
            if (-not (Test-Path "package/$root/$required")) { throw "$required missing" }
          }
      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 6.0.2 --add-source https://api.nuget.org/v3/index.json
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.Util.wixext/6.0.2
          & "$PWD/deploy/windows/generate-icon.ps1"
          $version = $env:RELEASE_TAG -replace '^v','' -replace '-beta([.-].*)$',''
          wix build deploy/windows/HWControl.wxs -ext WixToolset.Util.wixext -arch x64 -d Version=$version -d PackageDir="package/HWControl-$env:RELEASE_TAG-Windows-x64" -d IconPath=deploy/windows/HWControl.ico -o "HWControl-$env:RELEASE_TAG-Windows-x64.msi"
          if (-not (Test-Path "HWControl-$env:RELEASE_TAG-Windows-x64.msi")) { throw 'MSI was not produced' }
      - name: Smoke-test MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "HWControl-$env:RELEASE_TAG-Windows-x64.msi").Path
          $root = Join-Path $env:RUNNER_TEMP 'HWControl-Beta-MSI'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          & "$PWD\deploy\windows\Invoke-MsiWithTimeout.ps1" -MsiPath $msi -Action Install -LogPath "$root/install.log" -TimeoutSeconds 120
          if (-not (Test-Path "$env:ProgramFiles\HWControl\HWControl.exe")) { throw 'MSI did not install HWControl.exe' }
          if (-not (Test-Path "$env:ProgramFiles\HWControl\hwcontrol_audio_probe.exe")) { throw 'MSI did not install native audio helper' }
          if (-not (Test-Path "$env:ProgramFiles\HWControl\hwcontrol-hardware-identification.exe")) { throw 'C# hardware identification helper was not installed' }
          if (-not (Test-Path (Join-Path $env:USERPROFILE 'Desktop\HWControl.lnk'))) { throw 'MSI did not create the installing-user desktop shortcut' }
          & "$env:ProgramFiles\HWControl\hwcontrol-hardware-identification.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Installed C# hardware identification self-test failed' }
          if (-not (Test-Path "$env:ProgramFiles\HWControl\security-guardian.exe")) { throw 'security-guardian.exe missing' }
          if (-not (Test-Path "$env:ProgramData\HWControl\security\canary\bridger.key")) { throw 'bridger.key canary missing' }
          if (-not (Get-Service -Name HWControlBridge -ErrorAction SilentlyContinue)) { throw 'HWControlBridge service missing' }
          if (-not (Get-Service -Name HWControlSecurityGuardian -ErrorAction SilentlyContinue)) { throw 'HWControlSecurityGuardian service missing' }
          & "$PWD\deploy\windows\Invoke-MsiWithTimeout.ps1" -MsiPath $msi -Action Uninstall -LogPath "$root/uninstall.log" -TimeoutSeconds 120
          if (Get-Service -Name HWControlBridge -ErrorAction SilentlyContinue) { throw 'MSI uninstall left service behind' }
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "package/HWControl-$env:RELEASE_TAG-Windows-x64"
          $zip = "HWControl-$env:RELEASE_TAG-Windows-x64.zip"
          Compress-Archive -Path "$root/*" -DestinationPath $zip
          Expand-Archive $zip -DestinationPath verify-zip -Force
          if (-not (Test-Path "verify-zip/HWControl.exe")) { throw 'Portable ZIP validation failed' }
          if (-not (Test-Path "verify-zip/security-guardian.exe")) { throw 'Portable ZIP guardian missing' }
          if (-not (Test-Path "verify-zip/hwcontrol-hardware-identification.exe")) { throw 'Portable ZIP C# hardware identification helper missing' }
          if (-not (Test-Path "verify-zip/security/fetch-status/bridger.key")) { throw 'Portable ZIP canary missing' }
      - name: Build guided Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.Bal.wixext/6.0.2
          $version = $env:RELEASE_TAG -replace '^v','' -replace '-beta([.-].*)$',''
          wix build deploy/windows/HWControl-Setup.wxs -ext WixToolset.Bal.wixext -arch x64 -d Version=$version -d MsiPath="$PWD/HWControl-$env:RELEASE_TAG-Windows-x64.msi" -o "HWControl-$env:RELEASE_TAG-Windows-x64-Setup.exe"
          if (-not (Test-Path "HWControl-$env:RELEASE_TAG-Windows-x64-Setup.exe")) { throw 'Setup.exe was not produced' }
      - name: Build unsigned MSIX beta package
        shell: pwsh
        working-directory: gui_dashboard
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG -replace '^v','' -replace '-beta([.-].*)$',''
          dart run msix:create `
            --build-windows false `
            --display-name 'HWControl' `
            --publisher-display-name 'HWControl Beta' `
            --identity-name 'HWControl.Beta' `
            --publisher 'CN=HWControl Beta' `
            --version "$version.0" `
            --architecture x64 `
            --languages en-us `
            --install-certificate false `
            --sign-msix false `
            --output-path build/msix `
            --output-name "HWControl-$env:RELEASE_TAG-Windows-x64-MSIX"
          if ($LASTEXITCODE -ne 0) { throw "MSIX creation failed with exit code $LASTEXITCODE" }
          $msix = Get-ChildItem build/msix -Filter '*.msix' -File -Recurse | Select-Object -First 1
          if (-not $msix) { throw 'MSIX beta package was not produced' }
          Copy-Item $msix.FullName "../$($msix.Name)" -Force
          Write-Host "MSIX: $($msix.Name)"
      - name: Generate Windows checksums
        shell: pwsh
        run: |
          $files = @(
            "HWControl-$env:RELEASE_TAG-Windows-x64-Setup.exe",
            "HWControl-$env:RELEASE_TAG-Windows-x64.msi",
            "HWControl-$env:RELEASE_TAG-Windows-x64.zip",
            "HWControl-$env:RELEASE_TAG-Windows-x64-MSIX.msix"
          )
          $hashes = foreach ($file in $files) { "$((Get-FileHash $file -Algorithm SHA256).Hash.ToLower())  $file" }
          $hashes | Set-Content "HWControl-$env:RELEASE_TAG-Windows-x64.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64-Setup.exe
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64.msi
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64.zip
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64-MSIX.msix
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-windows-x64
          path: |
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64-Setup.exe
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64.msi
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64.zip
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64-MSIX.msix
            HWControl-${{ env.RELEASE_TAG }}-Windows-x64.sha256

  linux:
    needs: prepare-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev zstd dpkg-dev
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build and test
        run: |
          set -euo pipefail
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          (cd bridge_service && go vet ./... && go test -count=1 ./... && go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service ./src && go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../security-guardian ./security_guardian)
          (cd gui_dashboard && flutter create --platforms=linux --no-pub . && git restore pubspec.yaml test/widget_test.dart && flutter pub get && flutter analyze && flutter test --no-pub && flutter build linux --release -t lib/installer_main.dart --dart-define=HWCONTROL_RELEASE_TRUST=official)
      - name: Build DEB and archives
        run: |
          set -euo pipefail
          bash scripts/package-linux.sh "$RELEASE_TAG" build
          exit 0
          tag="$RELEASE_TAG"
          version="${tag#v}"; version="${version%-beta*}"
          root="HWControl-${tag}-Linux-x64"
          rm -rf package linux-deb
          mkdir -p "package/$root" linux-deb/DEBIAN linux-deb/opt/hwcontrol linux-deb/usr/bin linux-deb/lib/systemd/system
          install -m 0755 build/ai_core/ai_engine "package/$root/ai_engine"
          install -m 0755 build/audio_core/hwcontrol_audio_probe "package/$root/hwcontrol_audio_probe"
          install -m 0755 bridge-service "package/$root/bridge-service"
          install -m 0755 security-guardian "package/$root/security-guardian"
          install -m 0440 security/fetch-status/bridger.key "package/$root/security/fetch-status/bridger.key"
          cp -R gui_dashboard/build/linux/x64/release/bundle "package/$root/dashboard"
          cp README.md SECURITY.md THIRD_PARTY_NOTICES "package/$root/"
          cp -R deploy/linux "package/$root/deploy"
          cp -R "package/$root/." linux-deb/opt/hwcontrol/
          install -m 0644 deploy/linux/hwcontrol-bridge.service linux-deb/lib/systemd/system/hwcontrol-bridge.service
          install -m 0644 deploy/linux/hwcontrol-security-guardian.service linux-deb/lib/systemd/system/hwcontrol-security-guardian.service
          printf '%s\n' '#!/bin/sh' 'set -eu' 'KEY_DIR=/var/lib/hwcontrol' 'SECURITY_DIR=$KEY_DIR/security' 'CANARY_DIR=$SECURITY_DIR/canary' 'STATE_DIR=$SECURITY_DIR/state' 'mkdir -p $KEY_DIR $CANARY_DIR $STATE_DIR' 'chmod 0750 $KEY_DIR' 'if [ ! -s $KEY_DIR/bridge.key ]; then umask 077; od -An -N32 -tx1 /dev/urandom | tr -d " \\n" > $KEY_DIR/bridge.key; fi' 'chmod 0600 $KEY_DIR/bridge.key' 'if ! getent group hwcontrol-security >/dev/null; then groupadd --system hwcontrol-security; fi' 'if ! id hwcontrol-security >/dev/null 2>&1; then useradd --system --no-create-home --shell /usr/sbin/nologin --gid hwcontrol-security hwcontrol-security; fi' 'install -o root -g hwcontrol-security -m 0440 /opt/hwcontrol/security/fetch-status/bridger.key $CANARY_DIR/bridger.key' 'chown root:hwcontrol-security $CANARY_DIR' 'chmod 0750 $CANARY_DIR' 'chown hwcontrol-security:hwcontrol-security $STATE_DIR' 'chmod 0700 $STATE_DIR' 'systemctl daemon-reload' 'systemctl enable hwcontrol-bridge.service >/dev/null' 'systemctl enable hwcontrol-security-guardian.service >/dev/null' 'systemctl restart hwcontrol-bridge.service' 'systemctl restart hwcontrol-security-guardian.service' > linux-deb/DEBIAN/postinst
          chmod 0755 linux-deb/DEBIAN/postinst
          printf '%s\n' '#!/bin/sh' 'set -eu' 'systemctl disable --now hwcontrol-security-guardian.service 2>/dev/null || true' 'systemctl disable --now hwcontrol-bridge.service 2>/dev/null || true' > linux-deb/DEBIAN/prerm
          chmod 0755 linux-deb/DEBIAN/prerm
          printf '%s\n' '#!/bin/sh' 'set -eu' 'if [ "$1" = purge ]; then rm -rf /var/lib/hwcontrol; fi' 'systemctl daemon-reload 2>/dev/null || true' > linux-deb/DEBIAN/postrm
          chmod 0755 linux-deb/DEBIAN/postrm
          printf '%s\n' '#!/usr/bin/env bash' 'exec /opt/hwcontrol/dashboard/hwcontrol_dashboard "$@"' > linux-deb/usr/bin/hwcontrol
          chmod 0755 linux-deb/usr/bin/hwcontrol
          cat > linux-deb/DEBIAN/control <<EOF
          Package: hwcontrol
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: HWControl contributors
          Description: HWControl hardware monitoring and control suite
           Cross-platform local hardware monitoring application.
          EOF
          dpkg-deb --build --root-owner-group linux-deb "HWControl-${tag}-Linux-x64.deb"
          tar -czf "HWControl-${tag}-Linux-x64.tar.gz" -C package "$root"
          tar -cf bundle.tar -C package "$root"
          zstd -f bundle.tar -o "HWControl-${tag}-Linux-x64.tar.zst"
      - name: Smoke-test DEB
        run: |
          set -euo pipefail
          sudo dpkg -i "HWControl-$RELEASE_TAG-Linux-x64.deb"
          systemctl is-enabled hwcontrol-bridge.service
          systemctl is-active hwcontrol-bridge.service
          test -S /var/lib/hwcontrol/bridge.sock
          sudo systemctl stop hwcontrol-security-guardian.service || true
          sudo systemctl stop hwcontrol-bridge.service
          sudo dpkg -r hwcontrol
          test ! -e /opt/hwcontrol
          test ! -e /usr/bin/hwcontrol
          sudo rm -rf /var/lib/hwcontrol
      - name: Generate Linux checksums
        run: |
          sha256sum HWControl-$RELEASE_TAG-Linux-x64.deb HWControl-$RELEASE_TAG-Linux-x64.tar.gz HWControl-$RELEASE_TAG-Linux-x64.tar.zst > HWControl-$RELEASE_TAG-Linux-x64.sha256
          sha256sum -c HWControl-$RELEASE_TAG-Linux-x64.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            HWControl-${{ env.RELEASE_TAG }}-Linux-x64.deb
            HWControl-${{ env.RELEASE_TAG }}-Linux-x64.tar.gz
            HWControl-${{ env.RELEASE_TAG }}-Linux-x64.tar.zst
            HWControl-${{ env.RELEASE_TAG }}-Linux-x64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-linux-x64
          path: |
            HWControl-${{ env.RELEASE_TAG }}-Linux-x64.deb
            HWControl-${{ env.RELEASE_TAG }}-Linux-x64.tar.gz
            HWControl-${{ env.RELEASE_TAG }}-Linux-x64.tar.zst
            HWControl-${{ env.RELEASE_TAG }}-Linux-x64.sha256

  macos:
    needs: prepare-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.source_sha }}
      - run: brew install zstd
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.41.9 # Avoid known macOS release AOT crash in Flutter 3.47.x (flutter/flutter#191575).
          channel: stable
          architecture: ARM64
          cache: true
      - name: Build and test
        run: |
          set -euo pipefail
          cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          (cd bridge_service && go vet ./... && go test -count=1 ./... && go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../bridge-service ./src && go build -buildvcs=false -trimpath -ldflags='-s -w' -o ../security-guardian ./security_guardian)
          (cd gui_dashboard && flutter create --platforms=macos --no-pub . && git restore pubspec.yaml test/widget_test.dart && sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = HWControl/' macos/Runner/Configs/AppInfo.xcconfig && sed -i '' 's/^PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.hwcontrol.hwcontrol/' macos/Runner/Configs/AppInfo.xcconfig && flutter pub get && flutter analyze && flutter test --no-pub && flutter build macos --release -t lib/installer_main.dart --dart-define=HWCONTROL_RELEASE_TRUST=official)
      - name: Build PKG and DMG
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"; version="${version%-beta*}"
          rm -rf pkg-root dmg-root
          mkdir -p pkg-root/Applications/HWControl dmg-root
          cp -R gui_dashboard/build/macos/Build/Products/Release/HWControl.app pkg-root/Applications/HWControl/
          install -m 0755 build/ai_core/ai_engine pkg-root/Applications/HWControl/ai_engine
          install -m 0755 build/audio_core/hwcontrol_audio_probe pkg-root/Applications/HWControl/hwcontrol_audio_probe
          install -m 0755 bridge-service pkg-root/Applications/HWControl/bridge-service
          install -m 0755 security-guardian pkg-root/Applications/HWControl/security-guardian
          install -m 0644 deploy/macos/com.hwcontrol.bridge.plist pkg-root/Applications/HWControl/com.hwcontrol.bridge.plist
          cp README.md SECURITY.md THIRD_PARTY_NOTICES pkg-root/Applications/HWControl/
          cp -R deploy/macos pkg-root/Applications/HWControl/deploy
          pkgbuild --root pkg-root --identifier com.hwcontrol.hwcontrol --version "$version" --scripts deploy/macos/pkg-scripts --install-location / "HWControl-${tag}-macOS-AppleSilicon.pkg"
          cp -R pkg-root/Applications/HWControl/HWControl.app dmg-root/
          cp "HWControl-${tag}-macOS-AppleSilicon.pkg" dmg-root/
          hdiutil create -volname HWControl -srcfolder dmg-root -ov -format UDZO "HWControl-${tag}-macOS-AppleSilicon.dmg"
      - name: Smoke-test PKG
        run: |
          set -euo pipefail
          sudo installer -pkg "HWControl-$RELEASE_TAG-macOS-AppleSilicon.pkg" -target /
          test -d /Applications/HWControl/HWControl.app
          test -x /Applications/HWControl/bridge-service
          test -x /Applications/HWControl/hwcontrol_audio_probe
          test -x /Applications/HWControl/ai_engine
          test -x /Applications/HWControl/security-guardian
          test -f '/Library/Application Support/HWControl/security/canary/bridger.key'
          sudo launchctl bootout system /Library/LaunchDaemons/com.hwcontrol.bridge.plist || true
          sudo rm -rf /Applications/HWControl '/Library/Application Support/HWControl'
      - name: Generate macOS checksums
        run: |
          shasum -a 256 "HWControl-$RELEASE_TAG-macOS-AppleSilicon.pkg" "HWControl-$RELEASE_TAG-macOS-AppleSilicon.dmg" > "HWControl-$RELEASE_TAG-macOS-AppleSilicon.sha256"
          shasum -a 256 -c "HWControl-$RELEASE_TAG-macOS-AppleSilicon.sha256"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            HWControl-${{ env.RELEASE_TAG }}-macOS-AppleSilicon.pkg
            HWControl-${{ env.RELEASE_TAG }}-macOS-AppleSilicon.dmg
            HWControl-${{ env.RELEASE_TAG }}-macOS-AppleSilicon.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: beta-macos-arm64
          path: |
            HWControl-${{ env.RELEASE_TAG }}-macOS-AppleSilicon.pkg
            HWControl-${{ env.RELEASE_TAG }}-macOS-AppleSilicon.dmg
            HWControl-${{ env.RELEASE_TAG }}-macOS-AppleSilicon.sha256

  release:
    needs: [prepare-release, windows, linux, macos]
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
      - name: Verify expected beta matrix
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/beta-windows-x64/HWControl-${RELEASE_TAG}-Windows-x64-Setup.exe
          test -f release-assets/beta-windows-x64/HWControl-${RELEASE_TAG}-Windows-x64.msi
          test -f release-assets/beta-windows-x64/HWControl-${RELEASE_TAG}-Windows-x64.zip
          test -f release-assets/beta-windows-x64/HWControl-${RELEASE_TAG}-Windows-x64-MSIX.msix
          test -f release-assets/beta-macos-arm64/HWControl-${RELEASE_TAG}-macOS-AppleSilicon.pkg
          test -f release-assets/beta-macos-arm64/HWControl-${RELEASE_TAG}-macOS-AppleSilicon.dmg
          test -f release-assets/beta-linux-x64/HWControl-${RELEASE_TAG}-Linux-x64.deb
          test -f release-assets/beta-linux-x64/HWControl-${RELEASE_TAG}-Linux-x64.tar.gz
          test -f release-assets/beta-linux-x64/HWControl-${RELEASE_TAG}-Linux-x64.tar.zst
      - name: Generate aggregate checksums
        run: |
          find release-assets -type f ! -name 'SHA256SUMS' -printf '%f\\n' | sort -u | while IFS= read -r name; do
            file="$(find release-assets -type f -name "$name" -print -quit)"
            sha256sum "$file" | awk -v name="$name" '{ print $1 "  " name }'
          done > release-assets/SHA256SUMS
      - name: Publish beta release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: HWControl 2.0 ${{ env.RELEASE_TAG }}
          prerelease: true
          target_commitish: ${{ needs.prepare-release.outputs.source_sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/beta-windows-x64/*
            release-assets/beta-macos-arm64/*
            release-assets/beta-linux-x64/*
            release-assets/SHA256SUMS

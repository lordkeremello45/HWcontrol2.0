name: Sync release metadata to web app

on:
  workflow_run:
    workflows:
      - Release integrity
      - Publish Windows Setup bootstrapper
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-web-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("$RUNNER_TEMP/releases.json")
          data = json.loads(p.read_text())
          if not isinstance(data, list):
              raise SystemExit("GitHub releases response is not a JSON array")
          print(f"Fetched {len(data)} releases")
          PY

      - name: Generate release manifest
        run: |
          set -euo pipefail
          python3 scripts/generate-release-manifest.py "$RUNNER_TEMP/releases.json" website/release.json
          python3 -m json.tool website/release.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("website/release.json").read_text())
          assert data["schema"] == 1
          assert data["project"] == "HWControl"
          assert set(data["platforms"]) == {"windows", "macos", "linux"}
          for platform, release in data["platforms"].items():
              assert release["tag"].endswith(f"-{platform}")
              assert release["assets"]
              for asset in release["assets"]:
                  assert asset["name"] and asset["url"]
          print("release.json schema validation: OK")
          PY

      - name: Validate website against generated manifest
        run: |
          set -euo pipefail
          node --check website/app.js
          node --check scripts/website-release-test.mjs
          node scripts/website-release-test.mjs website/release.json

      - name: Commit release metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/release.json
          if git diff --cached --quiet; then
            echo 'Release metadata is already current.'
            exit 0
          fi
          git commit -m 'chore(web): sync latest stable release metadata'
          git push origin main

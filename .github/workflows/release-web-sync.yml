name: Sync release metadata to web app

on:
  workflow_run:
    workflows:
      - Release integrity
      - Publish Windows Setup bootstrapper
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-web-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/releases.json"

          python3 - "$RUNNER_TEMP/releases.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("GitHub releases response is not a JSON array")
          print(f"Fetched {len(data)} releases")
          PY

      - name: Refresh main before generating metadata
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Generate release manifest
        run: |
          set -euo pipefail
          python3 scripts/generate-release-manifest.py \
            "$RUNNER_TEMP/releases.json" \
            website/release.json
          python3 -m json.tool website/release.json >/dev/null
          node scripts/website-release-test.mjs website/release.json

      - name: Detect metadata changes
        id: changes
        run: |
          set -euo pipefail
          git add website/release.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release metadata is already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Release metadata changed."
          fi

      - name: Commit release metadata
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(web): sync latest stable release metadata'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Wait for main push to be visible
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          for attempt in $(seq 1 30); do
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
            if [ "$actual" = "$expected" ]; then
              echo "main is visible at $expected"
              exit 0
            fi
            echo "main still at $actual; waiting for $expected (attempt $attempt/30)"
            sleep 2
          done
          echo "Timed out waiting for main to expose $expected" >&2
          exit 1

      - name: Trigger Pages deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Pages deployment dispatched successfully."

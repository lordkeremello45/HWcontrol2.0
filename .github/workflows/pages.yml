name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate website JavaScript
        run: node --check website/app.js

      - name: Validate release metadata
        run: |
          set -euo pipefail

          test -f website/release.json
          python3 -m json.tool website/release.json >/dev/null
          node scripts/website-release-test.mjs website/release.json

      - name: Verify website installer integration
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('website/app.js', 'utf8');
          const requiredTokens = [
            "endsWith('-setup.exe')",
            'Setup · recommended',
            '.msi',
            '.zip'
          ];
          const missing = requiredTokens.filter(token => !source.includes(token));
          if (missing.length > 0) {
            console.error('Missing website installer integration tokens:');
            for (const token of missing) console.error(`  - ${token}`);
            process.exit(1);
          }
          console.log('Website installer integration: OK');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/website-release-test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate website JavaScript
        run: node --check website/app.js

      - name: Validate release manifest
        run: |
          node scripts/website-release-test.mjs website/release.json

      - name: Verify release-aware download selector
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('website/app.js', 'utf8');
          const tokens = ["const MANIFEST='./release.json';", 'state.manifest', 'checksum_sha256_url', "fetch(`${MANIFEST}?t=${Date.now()}`"];
          for (const token of tokens) {
            if (!source.includes(token)) throw new Error(`Missing release manifest integration token: ${token}`);
          }
          console.log('Website release manifest integration: OK');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and Deploy Astro Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/generate-release-manifest.py"
      - "scripts/website-release-test.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: website/package.json

      - name: Install dependencies
        working-directory: website
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Audit dependency tree
        working-directory: website
        run: npm audit --audit-level=high

      - name: Build Astro site
        working-directory: website
        run: npm run build

      - name: Validate generated site
        working-directory: website
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/release.json
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          grep -q 'HWControl 2.0' dist/index.html
          grep -q 'app.js' dist/index.html

      - name: Ensure release metadata is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f website/public/release.json ]; then
            echo 'website/release.json is absent; generating an ephemeral Pages manifest from stable releases.'
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq 'add' > "$RUNNER_TEMP/releases.json"
            python3 scripts/generate-release-manifest.py \
              "$RUNNER_TEMP/releases.json" \
              website/public/release.json
          fi
          test -s website/release.json || test -s website/public/release.json
          MANIFEST="website/release.json"
          [ -f "$MANIFEST" ] || MANIFEST="website/public/release.json"
          python3 -m json.tool "$MANIFEST" >/dev/null
          node scripts/website-release-test.mjs "$MANIFEST"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

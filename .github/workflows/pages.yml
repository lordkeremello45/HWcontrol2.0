name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'scripts/generate-release-manifest.py'
      - 'scripts/website-release-test.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

env:
  PAGES_ARTIFACT: github-pages

jobs:
  deploy:
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify checkout revision
        run: |
          set -euo pipefail
          echo "Deploying commit: $(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"

      - name: Validate website JavaScript
        run: node --check website/app.js

      - name: Ensure release metadata is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f website/release.json ]; then
            echo 'website/release.json is absent; generating an ephemeral Pages manifest from stable releases.'
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq 'add' > "$RUNNER_TEMP/releases.json"
            python3 scripts/generate-release-manifest.py \
              "$RUNNER_TEMP/releases.json" \
              website/release.json
          fi
          test -s website/release.json
          python3 -m json.tool website/release.json >/dev/null
          node scripts/website-release-test.mjs website/release.json

      - name: Verify website installer integration
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('website/app.js', 'utf8');
          const requiredTokens = [
            "endsWith('-setup.exe')",
            'Setup · recommended',
            '.msi',
            '.zip'
          ];
          const missing = requiredTokens.filter(token => !source.includes(token));
          if (missing.length > 0) {
            console.error('Missing website installer integration tokens:');
            for (const token of missing) console.error(`  - ${token}`);
            process.exit(1);
          }
          console.log('Website installer integration: OK');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ./website

      - name: Verify Pages artifact exists
        env:
          EXPECTED_ARTIFACT: ${{ env.PAGES_ARTIFACT }}
        run: |
          set -euo pipefail
          echo "Pages artifact prepared: $EXPECTED_ARTIFACT"
          test -f website/index.html
          test -f website/app.js
          test -f website/release.json

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
          timeout: 1200000
          error_count: 20
          reporting_interval: 5000

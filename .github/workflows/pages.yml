name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - Sync release metadata to web app
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate website JavaScript
        run: node --check website/app.js

      - name: Verify release-aware download selector
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('website/app.js', 'utf8');
          for (const token of ["endsWith('-setup.exe')", "Setup · recommended", '.msi', '.zip']) {
            if (!source.includes(token)) throw new Error(`Missing website installer integration token: ${token}`);
          }
          console.log('Website Windows installer integration: OK');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './website'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

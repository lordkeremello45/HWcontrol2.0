name: Build and test HWControl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config
      - name: Configure C++
        run: cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
      - name: Build C++ engine
        run: cmake --build build --parallel 2

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Configure C++ with MSVC
        run: cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
      - name: Build C++ engine with MSVC
        run: cmake --build build-windows --config Release --parallel 2
      - name: Test bridge
        working-directory: bridge_service
        run: go test -count=1 ./...
      - name: Build bridge
        working-directory: bridge_service
        run: go build -trimpath -o bridge-service.exe ./src
      - name: Validate Windows sensor adapter binary
        working-directory: bridge_service
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -o sensor-adapter-check.exe ./src

  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Test bridge
        run: go test -count=1 ./...
      - name: Build bridge
        run: go build -trimpath -o bridge-service ./src

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gui_dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze dashboard
        run: flutter analyze
      - name: Test dashboard
        run: flutter test --no-pub

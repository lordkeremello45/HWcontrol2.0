name: Build and test HWControl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure C++
        run: cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
      - name: Build C++ engine
        run: cmake --build build --parallel 2

  bridge:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Test bridge
        run: go test ./...
      - name: Build bridge
        run: go build -o bridge-service ./src

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gui_dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze dashboard
        run: flutter analyze

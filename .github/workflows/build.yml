name: Build and test HWControl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Keep main-branch validation runs alive; only superseded PR runs may be cancelled.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config
      - name: Configure C++
        run: cmake -S . -B build -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
      - name: Build C++ engine
        run: cmake --build build --parallel 2

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Configure C++ with MSVC
        run: cmake -S . -B build-windows -DGGML_NATIVE=OFF -DGGML_CCACHE=OFF
      - name: Build C++ engine with MSVC
        run: cmake --build build-windows --config Release --parallel 2
      - name: Test bridge
        working-directory: bridge_service
        run: go test -count=1 ./...
      - name: Build bridge
        working-directory: bridge_service
        run: go build -trimpath -o bridge-service.exe ./src
      - name: Build security guardian
        working-directory: bridge_service
        run: go build -trimpath -o security-guardian.exe ./security_guardian
      - name: Validate Windows sensor adapter binary
        working-directory: bridge_service
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -o sensor-adapter-check.exe ./src

  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge_service
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bridge_service/go.mod
          cache: false
      - name: Vet bridge
        run: go vet ./...
      - name: Test bridge
        run: go test -count=1 ./...
      - name: Build bridge
        run: go build -trimpath -o bridge-service ./src
      - name: Build security guardian
        working-directory: bridge_service
        run: go build -trimpath -o security-guardian ./security_guardian

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gui_dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate Flutter localizations
        run: flutter gen-l10n
      - name: Analyze dashboard
        run: flutter analyze
      - name: Test dashboard
        run: flutter test --no-pub

  workflow-lint:
    name: Validate GitHub Actions workflow syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: stable
          cache: false
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Lint all workflow files
        run: actionlint -color

  integrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Google Apps Script syntax
        run: node --check < integrations/google-feedback/Code.gs

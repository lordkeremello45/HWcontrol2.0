name: Bug report
description: Report a reproducible problem with HWControl
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Remove secrets and private data from logs.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable set of steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HWControl version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11 x64 / Ubuntu 24.04 x64 / macOS 14 arm64
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and drivers
      description: CPU, GPU, motherboard if relevant, and driver versions.
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Remove keys, tokens, credentials, and personal data before posting.

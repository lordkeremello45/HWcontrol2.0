name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and user experience.
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform and hardware considerations
      description: Include relevant Windows/Linux/macOS, driver, firmware, or hardware constraints.

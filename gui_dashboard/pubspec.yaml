name: hwcontrol_dashboard
description: HWControl 2.0 hardware monitoring dashboard.
publish_to: 'none'
version: 0.2.2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  crypto: ^3.0.3
  http: ^1.2.2
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: HWControl
  architecture: x64
  install_certificate: false
  languages: en-us
